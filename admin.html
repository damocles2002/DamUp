<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DamUp : Back-office administrateur</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A1120">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DamUp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: var(--ivoire-2); min-height: 100vh; }
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  .sidebar { background: var(--aubergine); color: var(--ivoire); padding: 22px 14px; display: flex; flex-direction: column; }
  .sidebar .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 22px; }
  .sidebar .brand .crown { width: 28px; }
  .sidebar .brand .nom { font-family: var(--font-titre); font-size: 23px; font-weight: 700; }
  .menu { display: flex; flex-direction: column; gap: 3px; }
  .menu a { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 11px;
            font-size: 14.5px; color: rgba(244,232,214,.72); cursor: pointer; text-decoration: none; }
  .menu a.on { background: rgba(244,232,214,.12); color: var(--champagne); font-weight: 600; }
  .menu .ico { font-size: 17px; width: 22px; text-align: center; }
  .menu .sep { height: 1px; background: rgba(244,232,214,.12); margin: 8px; }
  .sidebar .profil { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid rgba(244,232,214,.12); font-size: 13px; }
  .sidebar .profil b { color: var(--champagne); }

  .main { padding: 26px 32px; overflow-y: auto; }
  .main h1 { font-size: 25px; margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 24px; }
  .stat { background: #fff; border-radius: var(--radius-sm); padding: 18px 20px; box-shadow: 0 4px 16px rgba(42,17,32,.06); }
  .stat .v { font-family: var(--font-titre); font-size: 28px; font-weight: 700; }
  .stat .l { color: var(--gris); font-size: 13px; }
  .panneau { background: #fff; border-radius: var(--radius-sm); box-shadow: 0 4px 16px rgba(42,17,32,.06); margin-bottom: 18px; }
  .panneau .tete { padding: 15px 20px; border-bottom: 1px solid #F1E9DA; font-size: 16px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 11px 20px; color: var(--gris); font-size: 12px; font-weight: 600; text-transform: uppercase; }
  td { padding: 12px 20px; border-top: 1px solid #F5EEE2; }
  .cell { display: flex; align-items: center; gap: 10px; }
  .cell .av { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(140deg, var(--champagne), var(--aubergine-3));
              color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .champ-inline { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .champ-inline label { width: 120px; font-size: 14px; }
  .vide { color: var(--gris); padding: 30px; text-align: center; }
  .menu-mobile { display: none; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-content: start; }
    .sidebar { display: none; }
    .stats { grid-template-columns: 1fr 1fr; }
    .menu-mobile { display: flex; gap: 6px; overflow-x: auto; padding: 12px 16px; background: var(--aubergine); position: sticky; top: 0; z-index: 10; align-items: center; }
    .panneau { overflow-x: auto; }
    table { min-width: 560px; }
    td, th { overflow-wrap: normal; white-space: nowrap; }
    .menu-mobile a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px; border-radius: 10px; font-size: 10.5px; color: rgba(244,232,214,.72); cursor: pointer; text-decoration: none; white-space: nowrap; }
    .menu-mobile a .ico { font-size: 17px; }
    .menu-mobile a.on { background: rgba(244,232,214,.12); color: var(--champagne); font-weight: 600; }
    .main { padding: 16px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><img class="crown" src="assets/logo-couronne.png" alt=""><span class="nom">DamUp</span></div>
    <nav class="menu">
      <a class="on" data-vue="dashboard"><span class="ico">📊</span>Tableau de bord</a>
      <a data-vue="utilisateurs"><span class="ico">👥</span>Utilisateurs</a>
      <a data-vue="missions"><span class="ico">📅</span>Missions</a>
      <a data-vue="recettes"><span class="ico">💰</span>Recettes</a>
      <a data-vue="signalements"><span class="ico">🚩</span>Signalements</a>
      <a data-vue="equipe"><span class="ico">🛡️</span>Équipe & droits</a>
      <div class="sep"></div>
      <a data-vue="journal"><span class="ico">📜</span>Journal</a>
      <a data-vue="reglages"><span class="ico">⚙️</span>Réglages</a>
    </nav>
    <div class="profil">Connecté en <b>Administrateur</b></div>
    <a class="logout" id="logout"><span class="ico">🚪</span>Se déconnecter</a>
    <a class="logout" id="logout-global"><span class="ico">🔒</span>Déconnecter partout</a>
  </aside>

  <div class="menu-mobile">
    <a class="on" data-vue="dashboard"><span class="ico">📊</span>Tableau</a>
    <a data-vue="utilisateurs"><span class="ico">👥</span>Utilisateurs</a>
    <a data-vue="missions"><span class="ico">📅</span>Missions</a>
    <a data-vue="recettes"><span class="ico">💰</span>Recettes</a>
    <a data-vue="signalements"><span class="ico">🚩</span>Signalements</a>
    <a data-vue="equipe"><span class="ico">🛡️</span>Équipe</a>
    <a data-vue="journal"><span class="ico">📜</span>Journal</a>
    <a data-vue="reglages"><span class="ico">⚙️</span>Réglages</a>
    <a id="logout-mobile"><span class="ico">🚪</span>Quitter</a>
  </div>
  <main class="main" id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/ui.js"></script>
<script src="js/motdepasse.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
  const main = document.getElementById("main");
  let vue = "dashboard";
  let mesDroits = {};
  let jeSuisProprio = false;
  let droitsCharges = false;
  let monId = null;
  let mfaFactorId = null;
  let mfaSecret = "";
  let sessionAal2 = false;

  async function init() {
    const { data } = await auth.getUser();
    if (!data.user) { location.href = "login.html"; return; }
    monId = data.user.id;
    const { data: p } = await db.from("profiles").select("type").eq("id", data.user.id).single();
    if (!p || p.type !== "admin") { toast("Accès réservé à l'administrateur."); location.href = "index.html"; return; }
    // mot de passe provisoire → obliger à en choisir un nouveau
    if (data.user.user_metadata?.doit_changer_mdp) { sessionAal2 = false; afficherMenu(false); afficherChoixMdp(); return; }
    // double vérification obligatoire (TOTP)
    const { data: aal } = await auth.mfa.getAuthenticatorAssuranceLevel();
    if (aal && aal.currentLevel === "aal1") { sessionAal2 = false; afficherMenu(false); afficherMfa(); return; }
    sessionAal2 = true;
    afficherMenu(true);
    try {
      const { data: moi, error } = await sb.functions.invoke("membres", { body: { action: "moi" } });
      if (error || !moi?.data) {
        toast("Impossible de charger tes droits, recharge la page.", "erreur");
        droitsCharges = false;
      } else {
        mesDroits = moi.data.droits || {};
        jeSuisProprio = !!moi.data.proprietaire;
        droitsCharges = true;
      }
    } catch (e) {
      toast("Impossible de charger tes droits, recharge la page.", "erreur");
      droitsCharges = false;
    }
    adapterMenu();
    reinitialiserInactivite();
    afficher();
  }

  function afficherMfa() {
    auth.mfa.listFactors().then(async ({ data: facteurs }) => {
      const totp = (facteurs?.totp || []).find(f => f.status === "verified") || (facteurs?.totp || []).find(f => f.status === "unverified");
      if (!totp) {
        const { data, error } = await auth.mfa.enroll({ factorType: "totp" });
        if (error) { toast(error.message, "erreur"); return; }
        mfaFactorId = data.id;
        mfaSecret = data.totp.secret;
        main.innerHTML = `<div style="max-width:440px;margin:0 auto;padding:20px">
          <h1>Protège ton compte</h1>
          <p style="color:var(--gris);line-height:1.6">La double vérification est obligatoire pour accéder au back-office. Scanne ce QR code avec Google Authenticator, Microsoft Authenticator ou Authy.</p>
          <div style="display:flex;justify-content:center;margin:16px 0">${data.totp.qr_code}</div>
          <p style="font-size:13px;color:var(--gris)">Clé manuelle (si tu ne peux pas scanner) : <code style="word-break:break-all">${esc(mfaSecret)}</code></p>
          <div style="padding:10px;background:#FFF3E0;border-radius:8px;font-size:12.5px;color:#9A5B00;margin:12px 0">Note ta clé de secours dans un endroit sûr (hors du téléphone) : sans elle, si tu perds ton téléphone, seule une intervention dans Supabase pourra te rendre l'accès.</div>
          <div class="champ"><label class="label">Code à 6 chiffres</label><input class="field" id="mfa-code" inputmode="numeric" placeholder="123456"></div>
          <button class="btn btn-primaire btn-block" onclick="verifierMfa()">Activer la double vérification</button>
          <div style="text-align:center;margin-top:14px"><a style="color:var(--aubergine);cursor:pointer" onclick="deconnecter()">Se déconnecter</a></div>
        </div>`;
      } else {
        mfaFactorId = totp.id;
        main.innerHTML = `<div style="max-width:440px;margin:0 auto;padding:20px">
          <h1>Code de vérification</h1>
          <p style="color:var(--gris);line-height:1.6">Entre le code à 6 chiffres de ton application d'authentification.</p>
          <div class="champ"><label class="label">Code à 6 chiffres</label><input class="field" id="mfa-code" inputmode="numeric" placeholder="123456"></div>
          <button class="btn btn-primaire btn-block" onclick="verifierMfa()">Vérifier</button>
          <div style="text-align:center;margin-top:14px"><a style="color:var(--aubergine);cursor:pointer" onclick="deconnecter()">Se déconnecter</a></div>
        </div>`;
      }
    });
  }

  async function verifierMfa() {
    const code = document.getElementById("mfa-code").value.trim();
    if (code.length !== 6) { toast("Entre le code à 6 chiffres.", "erreur"); return; }
    const { data: challenge, error } = await auth.mfa.challenge({ factorId: mfaFactorId });
    if (error) { toast(error.message, "erreur"); return; }
    const { error: err } = await auth.mfa.verify({ factorId: mfaFactorId, challengeId: challenge.id, code });
    if (err) { toast("Code incorrect.", "erreur"); return; }
    await auth.refreshSession();
    location.reload();
  }

  function afficherMenu(visible) {
    document.querySelectorAll(".menu a[data-vue], .menu-mobile a[data-vue]").forEach(a => {
      a.style.display = visible ? "" : "none";
    });
  }
  async function afficherEcranSecurite() {
    const { data } = await auth.getUser();
    if (!data.user) { location.href = "login.html"; return; }
    if (data.user.user_metadata?.doit_changer_mdp) { afficherChoixMdp(); return; }
    afficherMfa();
  }

  function afficherChoixMdp() {
    main.innerHTML = `<div style="max-width:440px;margin:0 auto;padding:20px">
      <h1>Choisis ton mot de passe</h1>
      <p style="color:var(--gris);line-height:1.6">Ton mot de passe provisoire ne peut plus être utilisé. Choisis un nouveau mot de passe solide.</p>
      <div class="champ"><label class="label">Nouveau mot de passe</label><input class="field" id="nouveau-mdp" type="password"></div>
      <div class="champ"><label class="label">Confirme le mot de passe</label><input class="field" id="nouveau-mdp2" type="password"></div>
      <button class="btn btn-primaire btn-block" id="btn-choix-mdp" onclick="changerMdpProvisoire()">Enregistrer</button>
      <div style="text-align:center;margin-top:14px"><a style="color:var(--aubergine);cursor:pointer" onclick="deconnecter()">Se déconnecter</a></div>
    </div>`;
    brancherIndicateurMdp(document.getElementById("nouveau-mdp"), {}, document.getElementById("btn-choix-mdp"));
  }

  async function changerMdpProvisoire() {
    const m1 = document.getElementById("nouveau-mdp").value;
    const m2 = document.getElementById("nouveau-mdp2").value;
    if (!verifierMotDePasse(m1).ok) { toast("Mot de passe trop faible.", "erreur"); return; }
    if (m1 !== m2) { toast("Les deux mots de passe ne correspondent pas.", "erreur"); return; }
    const { error } = await auth.updateUser({ password: m1, data: { doit_changer_mdp: false } });
    if (error) { toast(messageErreur(error), "erreur"); return; }
    location.reload();
  }

  function ai(d) { return jeSuisProprio || mesDroits[d] === true; }
  function jePeux(d) { return ai(d); }
  function membreA(m, d) { return m?.proprietaire === true || m?.droits?.[d] === true; }
  function adapterMenu() {
    if (!droitsCharges) return; // on ne cache rien tant que les droits ne sont pas connus
    const visibilite = {
      dashboard: true,
      utilisateurs: ai("voir_donnees") || ai("valider_profils") || ai("suspendre_utilisateurs"),
      missions: ai("gerer_missions"),
      recettes: ai("voir_finances") || ai("paiements"),
      signalements: ai("signalements"),
      equipe: ai("gerer_equipe"),
      journal: ai("voir_journal"),
      reglages: ai("reglages"),
    };
    document.querySelectorAll(".menu a, .menu-mobile a").forEach(a => {
      const v = a.dataset.vue;
      if (v && visibilite[v] === false) a.style.display = "none";
    });
  }
  document.querySelectorAll(".menu a, .menu-mobile a").forEach(a => a.addEventListener("click", () => {
    vue = a.dataset.vue;
    document.querySelectorAll(".menu a, .menu-mobile a").forEach(x => x.classList.toggle("on", x.dataset.vue === vue));
    afficher();
  }));
  async function deconnecter() { await auth.signOut(); location.href = "login.html"; }
  document.getElementById("logout").addEventListener("click", deconnecter);
  document.getElementById("logout-mobile").addEventListener("click", deconnecter);
  document.getElementById("logout-global").addEventListener("click", async () => {
    if (!await demander("Déconnecter toutes tes sessions, sur tous tes appareils ?")) return;
    await auth.signOut({ scope: "global" });
    location.href = "login.html";
  });

  // ---- déconnexion automatique après 30 min d'inactivité ----
  let timerInactivite = null;
  let timerAvertissement = null;
  function reinitialiserInactivite() {
    clearTimeout(timerInactivite);
    clearTimeout(timerAvertissement);
    timerAvertissement = setTimeout(() => {
      toast("Ton back-office va se déconnecter dans 1 minute sans activité.", "info");
    }, 29 * 60 * 1000);
    timerInactivite = setTimeout(() => { deconnecter(); }, 30 * 60 * 1000);
  }
  ["mousemove", "keydown", "touchstart", "click"].forEach(ev => document.addEventListener(ev, reinitialiserInactivite, { passive: true }));

  function afficher() {
  if (!sessionAal2) { afficherEcranSecurite(); return; }
    if (vue === "dashboard") return afficherDashboard();
    if (vue === "utilisateurs") return afficherUtilisateurs();
    if (vue === "missions") return afficherMissions();
    if (vue === "recettes") return afficherRecettes();
    if (vue === "signalements") return afficherSignalements();
    if (vue === "journal") return afficherJournal();
    if (vue === "reglages") return afficherReglages();
    if (vue === "equipe") return afficherEquipe();
  }

  // ============ DASHBOARD ============
  async function afficherDashboard() {
  if (!sessionAal2) { afficherEcranSecurite(); return; }
    main.innerHTML = "<h1>Tableau de bord</h1><div class='stats'>chargement…</div>";
    const [h, e, m, c] = await Promise.all([
      db.from("hotesses").select("id", { count: "exact", head: true }),
      db.from("etablissements").select("id", { count: "exact", head: true }),
      db.from("missions").select("id", { count: "exact", head: true }),
      db.from("candidatures").select("id", { count: "exact", head: true }),
    ]);
    const voitFinances = jePeux('voir_finances') || jePeux('paiements');
    let totalRecettes = 0, aRenouveler = 0;
    if (voitFinances) {
      const { data: paiements } = await db.from("paiements").select("*");
      const mois = new Date().toISOString().slice(0, 7);
      const recettesMois = (paiements || []).filter(p => new Date(p.created_at).toISOString().slice(0, 7) === mois);
      totalRecettes = recettesMois.reduce((s, p) => s + Number(p.montant), 0);
      const { data: profils } = await db.from("profiles").select("id, actif_jusqu_a");
      aRenouveler = (profils || []).filter(p => p.actif_jusqu_a && new Date(p.actif_jusqu_a) > Date.now() && new Date(p.actif_jusqu_a) - Date.now() < 7 * 86400000).length;
    }
    main.innerHTML = `<h1>Tableau de bord</h1>
      <div class="stats">
        <div class="stat"><div class="v">${h.count ?? 0}</div><div class="l">Hôtesses inscrites</div></div>
        <div class="stat"><div class="v">${e.count ?? 0}</div><div class="l">Établissements</div></div>
        <div class="stat"><div class="v">${m.count ?? 0}</div><div class="l">Missions publiées</div></div>
        <div class="stat"><div class="v">${c.count ?? 0}</div><div class="l">Candidatures</div></div>
        ${voitFinances ? `
        <div class="stat" style="cursor:pointer" onclick="vue='recettes';afficherRecettes()"><div class="v">${montantFormat(totalRecettes)}</div><div class="l">Recettes du mois</div></div>
        <div class="stat" style="cursor:pointer" onclick="vue='utilisateurs';afficherUtilisateurs()"><div class="v">${aRenouveler}</div><div class="l">Abonnements à renouveler</div></div>` : ""}
      </div>
      ${jePeux('valider_profils') ? `<div class="panneau"><div class="tete">À valider</div><div id="a-valider" class="vide">Chargement…</div></div>` : ""}`;
    if (jePeux('valider_profils')) {
      const { data: nonVerif } = await db.from("hotesses").select("prenom, age, ville").eq("verifie", false).limit(5);
      document.getElementById("a-valider").innerHTML = (nonVerif && nonVerif.length)
        ? nonVerif.map(h => `<div style="padding:10px 20px;border-top:1px solid #F5EEE2">✨ ${esc(h.prenom)}, ${h.age} : ${esc(h.ville)} (photo à valider)</div>`).join("")
        : "Aucun profil en attente.";
    }
  }

  // ============ UTILISATEURS ============
  // ============ UTILISATEURS (annuaires) ============
  let annuaireType = "hotesses";
  let annuaireFiltre = "tous";
  let annuaireRecherche = "";
  let annuaireData = [];

  async function afficherUtilisateurs() {
  if (!sessionAal2) { afficherEcranSecurite(); return; }
    main.innerHTML = `<h1>Utilisateurs</h1>
      <div style="display:flex;gap:8px;margin:12px 0">
        <button class="btn btn-sm ${annuaireType==='hotesses'?'btn-primaire':''}" onclick="setAnnuaireType('hotesses')">Hôtesses</button>
        <button class="btn btn-sm ${annuaireType==='etablissements'?'btn-primaire':''}" onclick="setAnnuaireType('etablissements')">Établissements</button>
      </div>
      <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">
        <input class="field" id="a-recherche" placeholder="Rechercher…" oninput="annuaireRecherche=this.value;chargerAnnuaire()" style="max-width:240px">
        <select class="field" id="a-filtre" onchange="annuaireFiltre=this.value;chargerAnnuaire()" style="max-width:180px">
          <option value="tous">Tous</option>
          <option value="verifie">Vérifié</option>
          <option value="en_attente">En attente</option>
          <option value="suspendu">Suspendu</option>
        </select>
        <button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine)" onclick="exporterAnnuaire()">Exporter CSV</button>
        <button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine)" onclick="exporterAnnuaireXlsx()">Excel (.xlsx)</button>
      </div>
      <div class='panneau'><div id='liste-annuaire' class='vide'>Chargement…</div></div>`;
    document.getElementById("a-recherche").value = annuaireRecherche;
    document.getElementById("a-filtre").value = annuaireFiltre;
    chargerAnnuaire();
  }

  function setAnnuaireType(t) { annuaireType = t; afficherUtilisateurs(); }

  function statutBadge(verifie, suspendu) {
    if (suspendu) return '<span class="badge badge-rouge">Suspendu</span>';
    return verifie ? '<span class="badge badge-vert">Vérifié</span>' : '<span class="badge badge-champagne">En attente</span>';
  }
  function statutAbo(actif) {
    if (!actif) return '<span style="color:var(--gris)">Jamais payé</span>';
    const j = (new Date(actif) - Date.now()) / 86400000;
    const d = new Date(actif).toLocaleDateString("fr-FR");
    if (j < 0) return '<span style="color:#C0392B">Expiré</span>';
    if (j < 3) return '<span style="color:#E67E22">' + d + '</span>';
    return '<span style="color:#1E7A3C">' + d + '</span>';
  }

  // ==== PHOTOS & MÉDIAS (A1) ====
  let mediaListe = [];
  let mediaIndex = 0;
  let mediaModal = null;
  let mediaNom = "";

  function avatarPhoto(url, initial) {
    const u = urlPhoto(url);
    return u ? `<img src="${u}" style="width:32px;height:32px;border-radius:50%;object-fit:cover">`
             : `<div class="av">${esc((initial || "?")[0])}</div>`;
  }

  function vignettesMedia(photos, videos, nom) {
    const ph = (photos || []).map(p => urlPhoto(p)).filter(Boolean).map(u => ({ type: "img", u }));
    const vi = (videos || []).map(v => urlPhoto(v)).filter(Boolean).map(u => ({ type: "video", u }));
    mediaListe = ph.concat(vi);

    if (!mediaListe.length) return '<div style="font-size:12.5px;color:var(--gris)">Aucun média.</div>';
    return `<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0">
        ${mediaListe.map((m, i) => m.type === "img"
          ? `<img src="${m.u}" style="width:72px;height:72px;border-radius:10px;object-fit:cover;cursor:pointer" onclick="ouvrirMedia(${i})">`
          : `<video src="${m.u}" muted style="width:72px;height:72px;border-radius:10px;object-fit:cover;cursor:pointer" onclick="ouvrirMedia(${i})"></video>`).join("")}
      </div>

  function ouvrirMedia(index) {
    mediaIndex = index;
    if (!mediaModal) {
      mediaModal = document.createElement("div");
      mediaModal.id = "modal-media";
      mediaModal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:1000";

    }
    rendreMedia();

  function rendreMedia() {
    const m = mediaListe[mediaIndex];
    if (!m) return;
    mediaModal.innerHTML = `
      <button onclick="fermerMedia()" style="position:absolute;top:18px;right:20px;background:none;border:none;color:#fff;font-size:26px;cursor:pointer">✕</button>
      <button onclick="navMedia(-1)" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:none;color:#fff;font-size:30px;cursor:pointer;border-radius:50%;width:44px;height:44px">‹</button>
      <button onclick="navMedia(1)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:none;color:#fff;font-size:30px;cursor:pointer;border-radius:50%;width:44px;height:44px">›</button>

      </div>`;

  function navMedia(d) { mediaIndex = (mediaIndex + d + mediaListe.length) % mediaListe.length; rendreMedia(); }
  function fermerMedia() { if (mediaModal) { mediaModal.remove(); mediaModal = null; } }

  async function telechargerPhotos() {
    const imgs = mediaListe.filter(m => m.type === "img");
    if (!imgs.length) { toast("Aucune photo à télécharger."); return; }
    toast("Préparation du ZIP…", "info");
    try {
      const zip = new JSZip();
      for (let i = 0; i < imgs.length; i++) {
        const res = await fetch(imgs[i].u);
        const blob = await res.blob();
        zip.file((i + 1) + ".jpg", blob);
      }
      const blobZip = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blobZip);
      a.download = (mediaNom || "photos") + ".zip";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 1000);
    } catch (e) {
      toast("Impossible de télécharger les photos.", "erreur");
    }
  }

  // ==== EXPORTS (A2) ====
  async function telechargerOuPartager(blob, nom, mime) {
    const fichier = new File([blob], nom, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
      try { await navigator.share({ files: [fichier], title: nom }); return; } catch (e) { /* refus → téléchargement */ }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nom;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 1000);
  }
  function exporterXlsx(lignes, nom) {
    const ws = XLSX.utils.aoa_to_sheet(lignes);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Feuille1");
    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    telechargerOuPartager(new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), nom, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  }

  function exporterAnnuaire() {
    const sep = ";";
    const voitFin = jePeux('voir_finances') || jePeux('paiements');
    let lignes;
    if (annuaireType === "hotesses") {
      lignes = [["Prénom","Âge","E-mail","Instagram"]];
      annuaireData.forEach(h => lignes.push([h.prenom,h.age,h.email,h.instagram]));
    } else {
      const entete = ["Nom","Type","Ville","Adresse","Email","SIRET","Verifie","Suspendu","Missions","Inscrit le"];
      if (voitFin) entete.push("Tarif","Actif jusqu'au","Dernier mode");
      lignes = [entete];
      annuaireData.forEach(e => {
        const l = [e.nom,e.type,e.ville,e.adresse,e.email,e.siret,e.verifie?"oui":"non",e.suspendu?"oui":"non",e.missions_publiees,e.inscrit_le?new Date(e.inscrit_le).toLocaleDateString("fr-FR"):""];
        if (voitFin) l.push(e.tarif,e.actif_jusqu_a?new Date(e.actif_jusqu_a).toLocaleDateString("fr-FR"):"",e.dernier_mode);
        lignes.push(l);
      });
    }
    const csv = "\uFEFF" + lignes.map(l => l.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(sep)).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    telechargerOuPartager(blob, "annuaire-" + annuaireType + ".csv", "text/csv;charset=utf-8");
  }

  async function enregistrerPaiement(id) {
    const mode = document.getElementById("f-mode").value;
    const periode = document.getElementById("f-periode").value;
    const montant = parseFloat(document.getElementById("f-montant").value) || 0;
    const note = document.getElementById("f-note").value || null;
    const { data: paiement, error } = await db.rpc("admin_enregistrer_paiement", { p_profil: id, p_mode: mode, p_periode: periode, p_montant: montant, p_note: note });
    if (error) { toast(error.message, "erreur"); return; }
    if (paiement && mode !== "offert") {
      const { data: facture } = await db.from("factures").select("numero, envoyee_le, envoi_erreur, client").eq("paiement_id", paiement.id).eq("type", "facture").single();

    const { data: actuel } = await db.from("settings").select("key, value").in("key", ["paiement_etablissements_actif", "paiement_hotesses_actif", "paiement_en_ligne_actif"]);

    // validation de l'IBAN (doit commencer par FR)
    const elIban = zone.querySelector("#s-iban");
    if (elIban && elIban.value.trim()) {
      const iban = elIban.value.replace(/[\s.]/g, "").toUpperCase();
      if (!/^FR[0-9]{2}[A-Z0-9]{11,30}$/.test(iban)) { toast("IBAN invalide (doit commencer par FR).", "erreur"); return; }
    }
    const upserts = champs.map(el => {
      let v;
      if (el.type === "checkbox") v = el.checked ? "true" : "false";
      else if (el.id === "s-villes") v = JSON.stringify(el.value.split(",").map(x => x.trim()).filter(Boolean));
      else v = el.value;
      return { key: el.id.replace("s-", ""), value: v };
    });
    const { error } = await db.from("settings").upsert(upserts);
    if (error) { toast(error.message, "erreur"); return; }

  function genererMdpProvisoire() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";
    const arr = new Uint32Array(14);
    window.crypto.getRandomValues(arr);
    let mdp = "";
    for (let i = 0; i < 14; i++) mdp += chars[arr[i] % chars.length];
    const el = document.getElementById("m-mdp");
    el.value = mdp;
    el.dispatchEvent(new Event("input"));
  }

  function nomTresDifferent(a, b) {
    const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]/g, " ").replace(/\b(sarl|sas|sasu|eurl|sci|snc|scop|scic|association|asso)\b/g, " ")
      .replace(/\s+/g, " ").trim();
    const na = norm(a), nb = norm(b);
    if (!na || !nb) return false;
    if (na.includes(nb) || nb.includes(na)) return false;
    const motsA = na.split(" ").filter(m => m.length >= 4);
    const motsB = nb.split(" ").filter(m => m.length >= 4);
    return !motsA.some(m => motsB.includes(m));
  }

  async function voirConversationSignalement(id) {
    const { data, error } = await db.rpc("admin_lire_conversation", { p_signalement: id });
    if (error) { toast(error.message, "erreur"); return; }
    const modal = document.createElement("div");
    modal.id = "modal-conversation-admin";
    modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:996";
    modal.innerHTML = `<div style="background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-family:var(--font-titre);font-size:18px">💬 Conversation</h3><button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="document.getElementById('modal-conversation-admin').remove()">✕</button></div>
      ${(data && data.length) ? data.map(m => `<div style="margin-bottom:10px"><div style="font-size:11px;color:var(--gris);margin-bottom:2px">${esc(m.expediteur_type === "etablissement" ? "Établissement" : "Hôtesse")} · ${new Date(m.created_at).toLocaleString("fr-FR")}</div><div style="background:#F4E8D6;border-radius:12px;padding:9px 13px;font-size:13.5px;white-space:pre-line">${esc(m.contenu || (m.photo_url ? "📷 photo" : ""))}</div></div>`).join("") : '<div class="vide">Aucun message dans cette conversation.</div>'}
    </div>`;
    document.body.appendChild(modal);
  }

  async function annulerSanction(candId) {
    const motif = prompt("Motif de l'annulation de la sanction (obligatoire) :") || "";
    if (!motif) return;
    const { error } = await db.rpc("admin_annuler_sanction", { p_candidature: candId, p_motif: motif });
    if (error) { toast(error.message, "erreur"); return; }
    toast("Sanction annulée ✅ L'hôtesse est prévenue.");
    document.getElementById("modal-fiche-admin")?.remove();
    chargerAnnuaire();
  }

  init();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
