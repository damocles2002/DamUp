<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DamUp — Back-office administrateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: var(--ivoire-2); min-height: 100vh; }
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  .sidebar { background: var(--aubergine); color: var(--ivoire); padding: 22px 14px; display: flex; flex-direction: column; }
  .sidebar .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 22px; }
  .sidebar .brand .crown { width: 28px; }
  .sidebar .brand .nom { font-family: var(--font-titre); font-size: 23px; font-weight: 700; }
  .menu { display: flex; flex-direction: column; gap: 3px; }
  .menu a { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 11px;
            font-size: 14.5px; color: rgba(244,232,214,.72); cursor: pointer; text-decoration: none; }
  .menu a.on { background: rgba(244,232,214,.12); color: var(--champagne); font-weight: 600; }
  .menu .ico { font-size: 17px; width: 22px; text-align: center; }
  .menu .sep { height: 1px; background: rgba(244,232,214,.12); margin: 8px; }
  .sidebar .profil { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid rgba(244,232,214,.12); font-size: 13px; }
  .sidebar .profil b { color: var(--champagne); }

  .main { padding: 26px 32px; overflow-y: auto; }
  .main h1 { font-size: 25px; margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 24px; }
  .stat { background: #fff; border-radius: var(--radius-sm); padding: 18px 20px; box-shadow: 0 4px 16px rgba(42,17,32,.06); }
  .stat .v { font-family: var(--font-titre); font-size: 28px; font-weight: 700; }
  .stat .l { color: var(--gris); font-size: 13px; }
  .panneau { background: #fff; border-radius: var(--radius-sm); box-shadow: 0 4px 16px rgba(42,17,32,.06); margin-bottom: 18px; }
  .panneau .tete { padding: 15px 20px; border-bottom: 1px solid #F1E9DA; font-size: 16px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 11px 20px; color: var(--gris); font-size: 12px; font-weight: 600; text-transform: uppercase; }
  td { padding: 12px 20px; border-top: 1px solid #F5EEE2; }
  .cell { display: flex; align-items: center; gap: 10px; }
  .cell .av { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(140deg, var(--champagne), var(--aubergine-3));
              color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .champ-inline { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .champ-inline label { width: 120px; font-size: 14px; }
  .vide { color: var(--gris); padding: 30px; text-align: center; }
  .menu-mobile { display: none; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-content: start; }
    .sidebar { display: none; }
    .stats { grid-template-columns: 1fr 1fr; }
    .menu-mobile { display: flex; gap: 6px; overflow-x: auto; padding: 12px 16px; background: var(--aubergine); position: sticky; top: 0; z-index: 10; align-items: center; }
    .panneau { overflow-x: auto; }
    table { min-width: 560px; }
    td, th { overflow-wrap: normal; white-space: nowrap; }
    .menu-mobile a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px; border-radius: 10px; font-size: 10.5px; color: rgba(244,232,214,.72); cursor: pointer; text-decoration: none; white-space: nowrap; }
    .menu-mobile a .ico { font-size: 17px; }
    .menu-mobile a.on { background: rgba(244,232,214,.12); color: var(--champagne); font-weight: 600; }
    .main { padding: 16px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><img class="crown" src="assets/logo-couronne.png" alt=""><span class="nom">DamUp</span></div>
    <nav class="menu">
      <a class="on" data-vue="dashboard"><span class="ico">📊</span>Tableau de bord</a>
      <a data-vue="utilisateurs"><span class="ico">👥</span>Utilisateurs</a>
      <a data-vue="missions"><span class="ico">📅</span>Missions</a>
      <a data-vue="signalements"><span class="ico">🚩</span>Signalements</a>
      <a data-vue="equipe"><span class="ico">🛡️</span>Équipe & droits</a>
      <div class="sep"></div>
      <a data-vue="reglages"><span class="ico">⚙️</span>Réglages</a>
    </nav>
    <div class="profil">Connecté en <b>Administrateur</b></div>
  </aside>

  <div class="menu-mobile">
    <a class="on" data-vue="dashboard"><span class="ico">📊</span>Tableau</a>
    <a data-vue="utilisateurs"><span class="ico">👥</span>Utilisateurs</a>
    <a data-vue="missions"><span class="ico">📅</span>Missions</a>
    <a data-vue="signalements"><span class="ico">🚩</span>Signalements</a>
    <a data-vue="equipe"><span class="ico">🛡️</span>Équipe</a>
    <a data-vue="reglages"><span class="ico">⚙️</span>Réglages</a>
  </div>
  <main class="main" id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script>
  const main = document.getElementById("main");
  let vue = "dashboard";

  async function init() {
    const { data } = await auth.getUser();
    if (!data.user) { location.href = "login.html"; return; }
    const { data: p } = await db.from("profiles").select("type").eq("id", data.user.id).single();
    if (!p || p.type !== "admin") { alert("Accès réservé à l'administrateur."); location.href = "index.html"; return; }
    afficher();
  }
  document.querySelectorAll(".menu a, .menu-mobile a").forEach(a => a.addEventListener("click", () => {
    vue = a.dataset.vue;
    document.querySelectorAll(".menu a, .menu-mobile a").forEach(x => x.classList.toggle("on", x.dataset.vue === vue));
    afficher();
  }));

  function afficher() {
    if (vue === "dashboard") return afficherDashboard();
    if (vue === "utilisateurs") return afficherUtilisateurs();
    if (vue === "missions") return afficherMissions();
    if (vue === "signalements") return afficherSignalements();
    if (vue === "reglages") return afficherReglages();
    if (vue === "equipe") return afficherEquipe();
  }

  // ============ DASHBOARD ============
  async function afficherDashboard() {
    main.innerHTML = "<h1>Tableau de bord</h1><div class='stats'>chargement…</div>";
    const [h, e, m, c] = await Promise.all([
      db.from("hotesses").select("id", { count: "exact", head: true }),
      db.from("etablissements").select("id", { count: "exact", head: true }),
      db.from("missions").select("id", { count: "exact", head: true }),
      db.from("candidatures").select("id", { count: "exact", head: true }),
    ]);
    main.innerHTML = `<h1>Tableau de bord</h1>
      <div class="stats">
        <div class="stat"><div class="v">${h.count ?? 0}</div><div class="l">Hôtesses inscrites</div></div>
        <div class="stat"><div class="v">${e.count ?? 0}</div><div class="l">Établissements</div></div>
        <div class="stat"><div class="v">${m.count ?? 0}</div><div class="l">Missions publiées</div></div>
        <div class="stat"><div class="v">${c.count ?? 0}</div><div class="l">Candidatures</div></div>
      </div>
      <div class="panneau"><div class="tete">À valider</div><div id="a-valider" class="vide">Chargement…</div></div>`;
    const { data: nonVerif } = await db.from("hotesses").select("prenom, age, ville").eq("verifie", false).limit(5);
    document.getElementById("a-valider").innerHTML = (nonVerif && nonVerif.length)
      ? nonVerif.map(h => `<div style="padding:10px 20px;border-top:1px solid #F5EEE2">✨ ${esc(h.prenom)}, ${h.age} — ${esc(h.ville)} (photo à valider)</div>`).join("")
      : "Aucun profil en attente.";
  }

  // ============ UTILISATEURS ============
  async function afficherUtilisateurs() {
    main.innerHTML = "<h1>Utilisateurs</h1><div class='panneau'><div class='tete'>Hôtesses</div><div id='liste-hotesses' class='vide'>Chargement…</div></div><div class='panneau'><div class='tete'>Établissements</div><div id='liste-etabs' class='vide'>Chargement…</div></div>";
    const { data } = await db.rpc("admin_hotesses");
    document.getElementById("liste-hotesses").innerHTML = (data && data.length) ? `
      <table><tr><th>Hôtesse</th><th>Photos</th><th>Ville</th><th>Contact</th><th>Statut</th><th></th></tr>
      ${data.map(h => `<tr>
        <td><div class="cell"><div class="av">${esc((h.prenom||"?")[0])}</div>${esc(h.prenom)}, ${h.age}</div></td>
        <td>${(h.photos||[]).slice(0,3).map(p => urlPhoto(p) ? `<img src="${urlPhoto(p)}" style="width:28px;height:28px;border-radius:6px;object-fit:cover;margin-right:2px">` : "").join("") || "—"}</td>
        <td>${esc(h.ville || "—")}</td>
        <td style="font-size:12.5px;color:var(--gris)">${h.instagram ? `<a href="https://instagram.com/${esc(h.instagram.replace(/[^a-zA-Z0-9._]/g, ""))}" target="_blank">@${esc(h.instagram)}</a>` : ""}<br>${esc(h.telephone || "")}</td>
        <td>${h.verifie ? '<span class="badge badge-vert">Vérifiée</span>' : '<span class="badge badge-champagne">En attente</span>'}</td>
        <td>${h.verifie ? "" : `<button class="btn btn-sm btn-primaire" onclick="valider('${h.id}')">Valider</button> <button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger)" onclick="refuser('${h.id}','hotesse')">Refuser</button>`}</td>
      </tr>`).join("")}
      </table>` : "Aucune hôtesse.";
    const { data: etabs } = await db.from("etablissements").select("id, nom, type, ville, siret, photos, verifie").order("created_at", { ascending: false });
    document.getElementById("liste-etabs").innerHTML = (etabs && etabs.length) ? `
      <table><tr><th>Établissement</th><th>Type</th><th>Ville</th><th>SIRET</th><th>Statut</th><th></th></tr>
      ${etabs.map(e => `<tr>
        <td><div class="cell"><div class="av">${esc((e.nom||"?")[0])}</div>${esc(e.nom)}</div></td>
        <td>${esc(e.type || "—")}</td>
        <td>${esc(e.ville || "—")}</td>
        <td style="font-size:12.5px">${e.siret ? `<a href="https://annuaire-entreprises.data.gouv.fr/entreprise/${esc(String(e.siret).slice(0,9))}" target="_blank">${esc(e.siret)}</a>` : "—"}</td>
        <td>${e.verifie ? '<span class="badge badge-vert">Vérifié</span>' : '<span class="badge badge-champagne">En attente</span>'}</td>
        <td>${e.verifie ? "" : `<button class="btn btn-sm btn-primaire" onclick="validerEtab('${e.id}')">Valider</button> <button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger)" onclick="refuser('${e.id}','etablissement')">Refuser</button>`}</td>
      </tr>`).join("")}
      </table>` : "Aucun établissement.";
  }
  async function valider(id) {
    await db.from("hotesses").update({ verifie: true }).eq("id", id);
    afficherUtilisateurs();
  }
  async function validerEtab(id) {
    await db.from("etablissements").update({ verifie: true }).eq("id", id);
    afficherUtilisateurs();
  }
  async function refuser(id, type) {
    const motif = prompt("Motif du refus (envoyé à la personne) :");
    if (!motif) return;
    await db.from("notifications").insert({ user_id: id, message: "Ton profil n'a pas été validé : " + motif + ". Corrige-le puis contacte-nous." });
    afficherUtilisateurs();
  }

  // ============ SIGNALEMENTS ============
  let signalementsFiltre = "nouveau";
  async function afficherSignalements() {
    main.innerHTML = "<h1>Signalements</h1><div style='margin:10px 0'><button class='btn btn-sm' onclick='filtrerSignalements(\"nouveau\")'>Nouveaux</button> <button class='btn btn-sm' onclick='filtrerSignalements(\"traite\")'>Traités</button> <button class='btn btn-sm' onclick='filtrerSignalements(\"tous\")'>Tous</button></div><div class='panneau'><div class='tete'>Reçus</div><div id='liste' class='vide'>Chargement…</div></div>";
    signalementsFiltre = "nouveau";
    chargerSignalements();
  }
  async function chargerSignalements() {
    const { data } = await db.from("signalements").select("*").order("created_at", { ascending: false });
    const liste = (data || []).filter(s => signalementsFiltre === "tous" ? true : (signalementsFiltre === "nouveau" ? s.statut === "nouveau" : s.statut === "traite"));
    document.getElementById("liste").innerHTML = (liste.length) ? liste.map(s => `
      <div style="padding:13px 20px;border-top:1px solid #F5EEE2">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b>${esc(s.signalant_type)} → ${esc(s.cible_type)}</b>
          <span class="badge ${s.statut==='nouveau' ? 'badge-rouge' : 'badge-aubergine'}">${s.statut}</span>
        </div>
        <div style="font-size:12.5px;color:var(--gris);margin-top:4px">${esc(s.motif || "")}</div>
        <div style="font-size:12px;color:var(--gris);margin-top:4px">Le ${new Date(s.created_at).toLocaleString("fr-FR")} · ${esc(s.cible_id || "")}</div>
        <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
          <button class="btn btn-sm btn-primaire" onclick="traiterSignalement('${s.id}')">Marquer traité</button>
          <button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger)" onclick="suspendreCible('${s.id}','${s.cible_id}')">Suspendre</button>
          ${s.cible_type === 'mission' ? `<button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger)" onclick="annulerMissionSignalement('${s.cible_id}')">Annuler la mission</button>` : ""}
        </div>
      </div>`).join("") : "Aucun signalement.";
  }
  function filtrerSignalements(f) { signalementsFiltre = f; chargerSignalements(); }
  async function traiterSignalement(id) {
    const decision = prompt("Décision (affichée en interne) :");
    if (!decision) return;
    await db.from("signalements").update({ statut: "traite", decision }).eq("id", id);
    chargerSignalements();
  }
  async function suspendreCible(id, cibleId) {
    if (!confirm("Suspendre le compte visé ? Il ne pourra plus postuler ni publier.")) return;
    await db.from("profiles").update({ suspendu: true }).eq("id", cibleId);
    await db.from("signalements").update({ statut: "traite" }).eq("id", id);
    chargerSignalements();
  }
  async function annulerMissionSignalement(missionId) {
    if (!confirm("Annuler cette mission ?")) return;
    await db.from("missions").update({ statut: "annulee" }).eq("id", missionId);
    chargerSignalements();
  }

  // ============ RÉGLAGES (prix) ============
  async function afficherReglages() {
    main.innerHTML = `<h1>Réglages</h1><div class='panneau'><div class='tete'>Prix des abonnements</div>
      <div style="padding:20px">
        <div class="champ-inline"><label>Hebdomadaire (€)</label><input class="field" id="prix-hebdo" type="number" style="max-width:140px"></div>
        <div class="champ-inline"><label>Mensuel (€)</label><input class="field" id="prix-mensuel" type="number" style="max-width:140px"></div>
        <button class="btn btn-primaire btn-sm" onclick="sauverPrix()">Enregistrer</button>
        <div id="msg-prix" style="margin-top:10px;font-size:13px;color:var(--ok)"></div>
      </div></div>`;
    const { data } = await db.from("settings").select("*");
    const s = Object.fromEntries((data || []).map(r => [r.key, r.value]));
    document.getElementById("prix-hebdo").value = s.prix_hebdo || 25;
    document.getElementById("prix-mensuel").value = s.prix_mensuel || 79;
  }
  async function sauverPrix() {
    const hebdo = parseFloat(document.getElementById("prix-hebdo").value);
    const mensuel = parseFloat(document.getElementById("prix-mensuel").value);
    const msg = document.getElementById("msg-prix");
    if (!(hebdo > 0) || !(mensuel > 0)) { msg.style.color = "var(--danger)"; msg.textContent = "Saisis deux prix valides (supérieurs à 0)."; return; }
    const { error } = await db.from("settings").upsert([{ key: "prix_hebdo", value: hebdo }, { key: "prix_mensuel", value: mensuel }]);
    if (error) { msg.style.color = "var(--danger)"; msg.textContent = "Erreur : " + error.message; return; }
    msg.style.color = "var(--ok)";
    msg.textContent = "Prix enregistrés ✅";
  }

  // ============ ÉQUIPE & DROITS ============
  const DROITS_DISPONIBLES = [
    { key: "valider_profils", label: "Valider les profils" },
    { key: "gerer_annonces", label: "Gérer les annonces" },
    { key: "traiter_signalements", label: "Traiter les signalements" },
    { key: "gerer_prix", label: "Gérer les prix" },
    { key: "voir_stats", label: "Voir les statistiques" },
    { key: "echanger", label: "Échanger avec les membres" },
    { key: "gerer_equipe", label: "Gérer l'équipe" },
  ];
  let membresListe = [];
  let membreEnEdition = null;

  async function afficherEquipe() {
    membreEnEdition = null;
    main.innerHTML = `<h1>Équipe & droits</h1>
      <div class='panneau'><div class='tete'>Administrateurs</div><div id="liste-admins" class="vide">Chargement…</div></div>
      <div class='panneau'><div class='tete' id="titre-form">Créer un membre</div>
        <div style="padding:20px">
          <div class="champ-inline"><label>Nom</label><input class="field" id="m-nom" style="max-width:240px"></div>
          <div class="champ-inline"><label>E-mail</label><input class="field" id="m-email" type="email" style="max-width:240px"></div>
          <div class="champ-inline" id="ligne-mdp"><label>Mot de passe</label><input class="field" id="m-mdp" style="max-width:240px"></div>
          <div style="margin:14px 0 8px;font-size:14px;font-weight:600">Droits accordés :</div>
          <div id="m-droits" style="display:flex;flex-wrap:wrap;gap:10px">
            ${DROITS_DISPONIBLES.map(d => `<label style="display:flex;gap:6px;align-items:center;font-size:13.5px;background:var(--ivoire);padding:7px 12px;border-radius:999px;cursor:pointer"><input type="checkbox" value="${d.key}"> ${d.label}</label>`).join("")}
          </div>
          <button class="btn btn-primaire btn-sm" onclick="creerMembre()" style="margin-top:14px" id="btn-membre">Créer le compte</button>
          <div id="msg-membre" style="margin-top:10px;font-size:13px"></div>
        </div>
      </div>
      <div class='panneau'><div class='tete'>Membres de l'équipe</div><div id="liste-membres" class="vide">Chargement…</div></div>`;
    chargerMembres();
    chargerAdmins();
  }

  async function creerMembre() {
    const nom = document.getElementById("m-nom").value;
    const email = document.getElementById("m-email").value;
    const mdp = document.getElementById("m-mdp").value;
    const droits = Object.fromEntries([...document.querySelectorAll("#m-droits input:checked")].map(i => [i.value, true]));
    const msg = document.getElementById("msg-membre");

    // mode édition : on ne met à jour que les droits + le nom
    if (membreEnEdition) {
      const { data, error } = await sb.functions.invoke("membres", { body: { action: "update", id: membreEnEdition.id, nom, droits } });
      if (error || (data && data.error)) { msg.textContent = "Erreur : " + (data?.error || error?.message); return; }
      msg.textContent = "Droits mis à jour ✅";
      afficherEquipe();
      return;
    }

    // mode création
    if (!nom || !email || !mdp) { msg.textContent = "Remplis le nom, l'e-mail et le mot de passe."; return; }
    msg.textContent = "Création…";
    const { data, error } = await sb.functions.invoke("membres", { body: { action: "create", nom, email, password: mdp, droits } });
    if (error || (data && data.error)) { msg.textContent = "Erreur : " + (data?.error || error?.message); return; }
    msg.textContent = "Membre créé ✅ Il peut se connecter avec son e-mail + mot de passe.";
    afficherEquipe();
  }

  async function chargerMembres() {
    const { data } = await sb.functions.invoke("membres", { body: { action: "list" } });
    membresListe = data?.data || [];
    const zone = document.getElementById("liste-membres");
    if (!zone) return;
    if (!membresListe.length) { zone.innerHTML = "Aucun membre pour l'instant."; return; }
    zone.innerHTML = `<table><tr><th>Nom</th><th>Droits</th><th></th></tr>
      ${membresListe.map(m => `<tr>
        <td>${esc(m.nom || "—")}</td>
        <td style="font-size:12.5px;color:var(--gris)">${DROITS_DISPONIBLES.filter(d => m.droits && m.droits[d.key]).map(d => d.label).join(", ") || "aucun"}</td>
        <td>
          <button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine)" onclick="editerMembre('${m.id}')">Modifier</button>
          <button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger)" onclick="supprimerMembre('${m.id}','${m.user_id}')">Retirer</button>
        </td>
      </tr>`).join("")}</table>`;
  }

  function editerMembre(id) {
    const m = membresListe.find(x => x.id === id);
    if (!m) return;
    membreEnEdition = { id };
    document.getElementById("titre-form").textContent = "Modifier : " + (m.nom || "");
    document.getElementById("m-nom").value = m.nom || "";
    document.getElementById("m-email").style.display = "none";
    document.getElementById("ligne-mdp").style.display = "none";
    document.getElementById("btn-membre").textContent = "Enregistrer les droits";
    document.querySelectorAll("#m-droits input").forEach(i => { i.checked = !!(m.droits && m.droits[i.value]); });
    document.getElementById("msg-membre").textContent = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function supprimerMembre(id, user_id) {
    if (!confirm("Retirer ce membre ? Son accès sera supprimé.")) return;
    await sb.functions.invoke("membres", { body: { action: "delete", id, user_id } });
    chargerMembres();
  }

  async function chargerAdmins() {
    const { data } = await db.from("profiles").select("id, email").eq("type", "admin");
    const zone = document.getElementById("liste-admins");
    if (!zone) return;
    const moi = (await auth.getUser()).data.user.id;
    zone.innerHTML = (data && data.length) ? `<table><tr><th>E-mail</th><th>Rôle</th><th></th></tr>
      ${data.map(a => `<tr>
        <td>${esc(a.email)}</td>
        <td><span class="badge badge-aubergine">Admin</span></td>
        <td>${a.id === moi ? '<span style="color:var(--gris);font-size:12.5px">(vous)</span>' : `<button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger)" onclick="retrograderAdmin('${a.id}')">Retirer le rôle</button>`}</td>
      </tr>`).join("")}</table>` : "Aucun administrateur.";
  }

  async function retrograderAdmin(id) {
    if (!confirm("Retirer le rôle administrateur de ce compte ?")) return;
    await db.from("profiles").update({ type: "hotesse" }).eq("id", id);
    chargerAdmins();
  }

  // ============ MISSIONS ============
  async function afficherMissions() {
    main.innerHTML = "<h1>Missions</h1><div class='panneau'><div class='tete'>À venir</div><div id='liste-missions' class='vide'>Chargement…</div></div>";
    const { data } = await db.from("missions").select("id, date, heure_debut, heure_fin, places_restantes, nb_hotesses, statut, etablissements(nom)").order("date", { ascending: true });
    const aujourdhui = new Date().toISOString().slice(0, 10);
    const aVenir = (data || []).filter(m => m.date >= aujourdhui && !["terminee", "annulee"].includes(m.statut));
    document.getElementById("liste-missions").innerHTML = (aVenir.length) ? `
      <table><tr><th>Établissement</th><th>Date</th><th>Horaires</th><th>Places</th><th>Statut</th><th></th></tr>
      ${aVenir.map(m => `<tr>
        <td>${esc(m.etablissements?.nom || "—")}</td>
        <td>${formatDate(m.date)}</td>
        <td>${formatHeure(m.heure_debut)}–${formatHeure(m.heure_fin)}</td>
        <td>${m.places_restantes ?? m.nb_hotesses}/${m.nb_hotesses}</td>
        <td><span class="badge badge-aubergine">${esc(m.statut)}</span></td>
        <td><button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger)" onclick="annulerMissionAdmin('${m.id}')">Annuler</button></td>
      </tr>`).join("")}
      </table>` : "Aucune mission à venir.";
  }
  async function annulerMissionAdmin(id) {
    const motif = prompt("Motif de l'annulation (envoyé à l'établissement et aux hôtesses) :");
    if (!motif) return;
    await db.from("missions").update({ statut: "annulee" }).eq("id", id);
    const { data: m } = await db.from("missions").select("etablissement_id").eq("id", id).single();
    if (m) await db.from("notifications").insert({ user_id: m.etablissement_id, message: "Ta mission a été annulée par DamUp : " + motif + "." });
    const { data: cands } = await db.from("candidatures").select("hotesse_id").eq("mission_id", id).in("statut", ["acceptee", "confirmee"]);
    for (const c of (cands || [])) {
      await db.from("notifications").insert({ user_id: c.hotesse_id, message: "Ta mission a été annulée par DamUp : " + motif + "." });
    }
    afficherMissions();
  }

  init();
</script>
</body>
</html>
