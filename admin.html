<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DamUp — Back-office administrateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: var(--ivoire-2); min-height: 100vh; }
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  .sidebar { background: var(--aubergine); color: var(--ivoire); padding: 22px 14px; display: flex; flex-direction: column; }
  .sidebar .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 22px; }
  .sidebar .brand .crown { width: 28px; }
  .sidebar .brand .nom { font-family: var(--font-titre); font-size: 23px; font-weight: 700; }
  .menu { display: flex; flex-direction: column; gap: 3px; }
  .menu a { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 11px;
            font-size: 14.5px; color: rgba(244,232,214,.72); cursor: pointer; text-decoration: none; }
  .menu a.on { background: rgba(244,232,214,.12); color: var(--champagne); font-weight: 600; }
  .menu .ico { font-size: 17px; width: 22px; text-align: center; }
  .menu .sep { height: 1px; background: rgba(244,232,214,.12); margin: 8px; }
  .sidebar .profil { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid rgba(244,232,214,.12); font-size: 13px; }
  .sidebar .profil b { color: var(--champagne); }

  .main { padding: 26px 32px; overflow-y: auto; }
  .main h1 { font-size: 25px; margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 24px; }
  .stat { background: #fff; border-radius: var(--radius-sm); padding: 18px 20px; box-shadow: 0 4px 16px rgba(42,17,32,.06); }
  .stat .v { font-family: var(--font-titre); font-size: 28px; font-weight: 700; }
  .stat .l { color: var(--gris); font-size: 13px; }
  .panneau { background: #fff; border-radius: var(--radius-sm); box-shadow: 0 4px 16px rgba(42,17,32,.06); margin-bottom: 18px; }
  .panneau .tete { padding: 15px 20px; border-bottom: 1px solid #F1E9DA; font-size: 16px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 11px 20px; color: var(--gris); font-size: 12px; font-weight: 600; text-transform: uppercase; }
  td { padding: 12px 20px; border-top: 1px solid #F5EEE2; }
  .cell { display: flex; align-items: center; gap: 10px; }
  .cell .av { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(140deg, var(--champagne), var(--aubergine-3));
              color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .champ-inline { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .champ-inline label { width: 120px; font-size: 14px; }
  .vide { color: var(--gris); padding: 30px; text-align: center; }
  .menu-mobile { display: none; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-content: start; }
    .sidebar { display: none; }
    .stats { grid-template-columns: 1fr 1fr; }
    .menu-mobile { display: flex; gap: 6px; overflow-x: auto; padding: 12px 16px; background: var(--aubergine); position: sticky; top: 0; z-index: 10; align-items: center; }
    .panneau { overflow-x: auto; }
    table { min-width: 560px; }
    td, th { overflow-wrap: normal; white-space: nowrap; }
    .menu-mobile a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px; border-radius: 10px; font-size: 10.5px; color: rgba(244,232,214,.72); cursor: pointer; text-decoration: none; white-space: nowrap; }
    .menu-mobile a .ico { font-size: 17px; }
    .menu-mobile a.on { background: rgba(244,232,214,.12); color: var(--champagne); font-weight: 600; }
    .main { padding: 16px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><img class="crown" src="assets/logo-couronne.png" alt=""><span class="nom">DamUp</span></div>
    <nav class="menu">
      <a class="on" data-vue="dashboard"><span class="ico">📊</span>Tableau de bord</a>
      <a data-vue="utilisateurs"><span class="ico">👥</span>Utilisateurs</a>
      <a data-vue="missions"><span class="ico">📅</span>Missions</a>
      <a data-vue="recettes"><span class="ico">💰</span>Recettes</a>
      <a data-vue="signalements"><span class="ico">🚩</span>Signalements</a>
      <a data-vue="equipe"><span class="ico">🛡️</span>Équipe & droits</a>
      <div class="sep"></div>
      <a data-vue="reglages"><span class="ico">⚙️</span>Réglages</a>
    </nav>
    <div class="profil">Connecté en <b>Administrateur</b></div>
    <a class="logout" id="logout"><span class="ico">🚪</span>Se déconnecter</a>
  </aside>

  <div class="menu-mobile">
    <a class="on" data-vue="dashboard"><span class="ico">📊</span>Tableau</a>
    <a data-vue="utilisateurs"><span class="ico">👥</span>Utilisateurs</a>
    <a data-vue="missions"><span class="ico">📅</span>Missions</a>
    <a data-vue="recettes"><span class="ico">💰</span>Recettes</a>
    <a data-vue="signalements"><span class="ico">🚩</span>Signalements</a>
    <a data-vue="equipe"><span class="ico">🛡️</span>Équipe</a>
    <a data-vue="reglages"><span class="ico">⚙️</span>Réglages</a>
    <a id="logout-mobile"><span class="ico">🚪</span>Quitter</a>
  </div>
  <main class="main" id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/ui.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
  const main = document.getElementById("main");
  let vue = "dashboard";

  async function init() {
    const { data } = await auth.getUser();
    if (!data.user) { location.href = "login.html"; return; }
    const { data: p } = await db.from("profiles").select("type").eq("id", data.user.id).single();
    if (!p || p.type !== "admin") { toast("Accès réservé à l'administrateur."); location.href = "index.html"; return; }
    afficher();
  }
  document.querySelectorAll(".menu a, .menu-mobile a").forEach(a => a.addEventListener("click", () => {
    vue = a.dataset.vue;
    document.querySelectorAll(".menu a, .menu-mobile a").forEach(x => x.classList.toggle("on", x.dataset.vue === vue));
    afficher();
  }));
  async function deconnecter() { await auth.signOut(); location.href = "login.html"; }
  document.getElementById("logout").addEventListener("click", deconnecter);
  document.getElementById("logout-mobile").addEventListener("click", deconnecter);

  function afficher() {
    if (vue === "dashboard") return afficherDashboard();
    if (vue === "utilisateurs") return afficherUtilisateurs();
    if (vue === "missions") return afficherMissions();
    if (vue === "recettes") return afficherRecettes();
    if (vue === "signalements") return afficherSignalements();
    if (vue === "reglages") return afficherReglages();
    if (vue === "equipe") return afficherEquipe();
  }

  // ============ DASHBOARD ============
  async function afficherDashboard() {
    main.innerHTML = "<h1>Tableau de bord</h1><div class='stats'>chargement…</div>";
    const [h, e, m, c] = await Promise.all([
      db.from("hotesses").select("id", { count: "exact", head: true }),
      db.from("etablissements").select("id", { count: "exact", head: true }),
      db.from("missions").select("id", { count: "exact", head: true }),
      db.from("candidatures").select("id", { count: "exact", head: true }),
    ]);
    const { data: paiements } = await db.from("paiements").select("*");
    const mois = new Date().toISOString().slice(0, 7);
    const recettesMois = (paiements || []).filter(p => new Date(p.created_at).toISOString().slice(0, 7) === mois);
    const totalRecettes = recettesMois.reduce((s, p) => s + Number(p.montant), 0);
    const { data: profils } = await db.from("profiles").select("id, actif_jusqu_a");
    const aRenouveler = (profils || []).filter(p => p.actif_jusqu_a && new Date(p.actif_jusqu_a) > Date.now() && new Date(p.actif_jusqu_a) - Date.now() < 7 * 86400000).length;
    main.innerHTML = `<h1>Tableau de bord</h1>
      <div class="stats">
        <div class="stat"><div class="v">${h.count ?? 0}</div><div class="l">Hôtesses inscrites</div></div>
        <div class="stat"><div class="v">${e.count ?? 0}</div><div class="l">Établissements</div></div>
        <div class="stat"><div class="v">${m.count ?? 0}</div><div class="l">Missions publiées</div></div>
        <div class="stat"><div class="v">${c.count ?? 0}</div><div class="l">Candidatures</div></div>
        <div class="stat" style="cursor:pointer" onclick="vue='recettes';afficherRecettes()"><div class="v">${totalRecettes.toFixed(0)} €</div><div class="l">Recettes du mois</div></div>
        <div class="stat" style="cursor:pointer" onclick="vue='utilisateurs';afficherUtilisateurs()"><div class="v">${aRenouveler}</div><div class="l">Abonnements à renouveler</div></div>
      </div>
      <div class="panneau"><div class="tete">À valider</div><div id="a-valider" class="vide">Chargement…</div></div>`;
    const { data: nonVerif } = await db.from("hotesses").select("prenom, age, ville").eq("verifie", false).limit(5);
    document.getElementById("a-valider").innerHTML = (nonVerif && nonVerif.length)
      ? nonVerif.map(h => `<div style="padding:10px 20px;border-top:1px solid #F5EEE2">✨ ${esc(h.prenom)}, ${h.age} — ${esc(h.ville)} (photo à valider)</div>`).join("")
      : "Aucun profil en attente.";
  }

  // ============ UTILISATEURS ============
  // ============ UTILISATEURS (annuaires) ============
  let annuaireType = "hotesses";
  let annuaireFiltre = "tous";
  let annuaireRecherche = "";
  let annuaireData = [];

  async function afficherUtilisateurs() {
    main.innerHTML = `<h1>Utilisateurs</h1>
      <div style="display:flex;gap:8px;margin:12px 0">
        <button class="btn btn-sm ${annuaireType==='hotesses'?'btn-primaire':''}" onclick="setAnnuaireType('hotesses')">Hôtesses</button>
        <button class="btn btn-sm ${annuaireType==='etablissements'?'btn-primaire':''}" onclick="setAnnuaireType('etablissements')">Établissements</button>
      </div>
      <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">
        <input class="field" id="a-recherche" placeholder="Rechercher…" oninput="annuaireRecherche=this.value;chargerAnnuaire()" style="max-width:240px">
        <select class="field" id="a-filtre" onchange="annuaireFiltre=this.value;chargerAnnuaire()" style="max-width:180px">
          <option value="tous">Tous</option>
          <option value="verifie">Vérifié</option>
          <option value="en_attente">En attente</option>
          <option value="suspendu">Suspendu</option>
        </select>
        <button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine)" onclick="exporterAnnuaire()">Exporter CSV</button>
        <button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine)" onclick="exporterAnnuaireXlsx()">Excel (.xlsx)</button>
      </div>
      <div class='panneau'><div id='liste-annuaire' class='vide'>Chargement…</div></div>`;
    document.getElementById("a-recherche").value = annuaireRecherche;
    document.getElementById("a-filtre").value = annuaireFiltre;
    chargerAnnuaire();
  }

  function setAnnuaireType(t) { annuaireType = t; afficherUtilisateurs(); }

  function statutBadge(verifie, suspendu) {
    if (suspendu) return '<span class="badge badge-rouge">Suspendu</span>';
    return verifie ? '<span class="badge badge-vert">Vérifié</span>' : '<span class="badge badge-champagne">En attente</span>';
  }
  function statutAbo(actif) {
    if (!actif) return '<span style="color:var(--gris)">Jamais payé</span>';
    const j = (new Date(actif) - Date.now()) / 86400000;
    const d = new Date(actif).toLocaleDateString("fr-FR");
    if (j < 0) return '<span style="color:#C0392B">Expiré</span>';
    if (j < 3) return '<span style="color:#E67E22">' + d + '</span>';
    return '<span style="color:#1E7A3C">' + d + '</span>';
  }

  // ==== PHOTOS & MÉDIAS (A1) ====
  let mediaListe = [];
  let mediaIndex = 0;
  let mediaModal = null;
  let mediaNom = "";

  function avatarPhoto(url, initial) {
    const u = urlPhoto(url);
    return u ? `<img src="${u}" style="width:32px;height:32px;border-radius:50%;object-fit:cover">`
             : `<div class="av">${esc((initial || "?")[0])}</div>`;
  }

  function vignettesMedia(photos, videos, nom) {
    const ph = (photos || []).map(p => urlPhoto(p)).filter(Boolean).map(u => ({ type: "img", u }));
    const vi = (videos || []).map(v => urlPhoto(v)).filter(Boolean).map(u => ({ type: "video", u }));
    mediaListe = ph.concat(vi);
    mediaNom = nom;
    if (!mediaListe.length) return '<div style="font-size:12.5px;color:var(--gris)">Aucun média.</div>';
    return `<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0">
        ${mediaListe.map((m, i) => m.type === "img"
          ? `<img src="${m.u}" style="width:72px;height:72px;border-radius:10px;object-fit:cover;cursor:pointer" onclick="ouvrirMedia(${i})">`
          : `<video src="${m.u}" muted style="width:72px;height:72px;border-radius:10px;object-fit:cover;cursor:pointer" onclick="ouvrirMedia(${i})"></video>`).join("")}
      </div>
      <button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine)" onclick="telechargerPhotos()">⬇️ Télécharger toutes les photos</button>`;
  }

  function ouvrirMedia(index) {
    mediaIndex = index;
    if (!mediaModal) {
      mediaModal = document.createElement("div");
      mediaModal.id = "modal-media";
      mediaModal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:1000";
      document.body.appendChild(mediaModal);
    }
    rendreMedia();
  }
  function rendreMedia() {
    const m = mediaListe[mediaIndex];
    if (!m) return;
    mediaModal.innerHTML = `
      <button onclick="fermerMedia()" style="position:absolute;top:18px;right:20px;background:none;border:none;color:#fff;font-size:26px;cursor:pointer">✕</button>
      <button onclick="navMedia(-1)" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:none;color:#fff;font-size:30px;cursor:pointer;border-radius:50%;width:44px;height:44px">‹</button>
      <button onclick="navMedia(1)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:none;color:#fff;font-size:30px;cursor:pointer;border-radius:50%;width:44px;height:44px">›</button>
      <div style="max-width:92vw;max-height:90vh;display:flex;align-items:center;justify-content:center">
        ${m.type === "img" ? `<img src="${m.u}" style="max-width:92vw;max-height:88vh;border-radius:8px">` : `<video src="${m.u}" controls autoplay style="max-width:92vw;max-height:88vh;border-radius:8px"></video>`}
      </div>`;
  }
  function navMedia(d) { mediaIndex = (mediaIndex + d + mediaListe.length) % mediaListe.length; rendreMedia(); }
  function fermerMedia() { if (mediaModal) { mediaModal.remove(); mediaModal = null; } }

  async function telechargerPhotos() {
    const imgs = mediaListe.filter(m => m.type === "img");
    if (!imgs.length) { toast("Aucune photo à télécharger."); return; }
    toast("Préparation du ZIP…", "info");
    try {
      const zip = new JSZip();
      for (let i = 0; i < imgs.length; i++) {
        const res = await fetch(imgs[i].u);
        const blob = await res.blob();
        zip.file((i + 1) + ".jpg", blob);
      }
      const blobZip = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blobZip);
      a.download = (mediaNom || "photos") + ".zip";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 1000);
    } catch (e) {
      toast("Impossible de télécharger les photos.", "erreur");
    }
  }

  // ==== EXPORTS (A2) ====
  async function telechargerOuPartager(blob, nom, mime) {
    const fichier = new File([blob], nom, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
      try { await navigator.share({ files: [fichier], title: nom }); return; } catch (e) { /* refus → téléchargement */ }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nom;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 1000);
  }
  function exporterXlsx(lignes, nom) {
    const ws = XLSX.utils.aoa_to_sheet(lignes);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Feuille1");
    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    telechargerOuPartager(new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), nom, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  }

  function filtreAnnuaire(x) {
    if (annuaireFiltre === "verifie") return x.verifie;
    if (annuaireFiltre === "en_attente") return !x.verifie;
    if (annuaireFiltre === "suspendu") return x.suspendu;
    return true;
  }
  function chercheAnnuaire(txt) {
    if (!annuaireRecherche) return true;
    return (txt || "").toLowerCase().includes(annuaireRecherche.toLowerCase());
  }

  async function chargerAnnuaire() {
    const zone = document.getElementById("liste-annuaire");
    if (!zone) return;
    if (annuaireType === "hotesses") {
      const { data } = await db.rpc("admin_annuaire_hotesses");
      annuaireData = data || [];
      const f = annuaireData.filter(h => filtreAnnuaire(h) && chercheAnnuaire(h.prenom + " " + (h.email||"") + " " + (h.ville||"") + " " + (h.instagram||"")));
      zone.innerHTML = f.length ? `<table><tr><th>Hôtesse</th><th>Ville</th><th>Contact</th><th>Statut</th><th>Honorées</th><th>Note</th><th></th></tr>
        ${f.map(h => `<tr style="cursor:pointer" onclick="ouvrirFicheAdmin('hotesse','${h.id}')">
          <td><div class="cell">${avatarPhoto(h.photos?.[0], h.prenom)}${esc(h.prenom)}, ${h.age}</div></td>
          <td>${esc(h.ville || "—")}</td>
          <td style="font-size:12.5px;color:var(--gris)"><a href="mailto:${esc(h.email||"")}">${esc(h.email||"")}</a>${h.instagram ? `<br><a href="https://instagram.com/${esc(h.instagram.replace(/[^a-zA-Z0-9._]/g,""))}" target="_blank">@${esc(h.instagram)}</a>` : ""}</td>
          <td>${statutBadge(h.verifie, h.suspendu)}</td>
          <td>${h.missions_honorees ?? 0}</td>
          <td>${h.note_moyenne ?? 5} (${h.nb_avis ?? 0})</td>
          <td><button class="btn btn-sm btn-primaire" onclick="event.stopPropagation();ouvrirFicheAdmin('hotesse','${h.id}')">Fiche</button></td>
        </tr>`).join("")}</table>` : '<div class="vide">Aucun résultat.</div>';
    } else {
      const { data } = await db.rpc("admin_annuaire_etablissements");
      annuaireData = data || [];
      const f = annuaireData.filter(e => filtreAnnuaire(e) && chercheAnnuaire(e.nom + " " + (e.email||"") + " " + (e.ville||"")));
      zone.innerHTML = f.length ? `<table><tr><th>Établissement</th><th>Type</th><th>Ville</th><th>E-mail</th><th>Tarif</th><th>Actif jusqu'au</th><th></th></tr>
        ${f.map(e => `<tr style="cursor:pointer" onclick="ouvrirFicheAdmin('etablissement','${e.id}')">
          <td><div class="cell">${avatarPhoto(e.photos?.[0], e.nom)}${esc(e.nom)}</div></td>
          <td>${esc(e.type || "—")}</td>
          <td>${esc(e.ville || "—")}</td>
          <td style="font-size:12.5px"><a href="mailto:${esc(e.email||"")}">${esc(e.email||"")}</a></td>
          <td>${e.tarif ?? "—"} €</td>
          <td>${statutAbo(e.actif_jusqu_a)}</td>
          <td><button class="btn btn-sm btn-primaire" onclick="event.stopPropagation();ouvrirFicheAdmin('etablissement','${e.id}')">Fiche</button></td>
        </tr>`).join("")}</table>` : '<div class="vide">Aucun résultat.</div>';
    }
  }

  function exporterAnnuaire() {
    const sep = ";";
    let lignes;
    if (annuaireType === "hotesses") {
      lignes = [["Prénom","Âge","E-mail","Instagram"]];
      annuaireData.forEach(h => lignes.push([h.prenom,h.age,h.email,h.instagram]));
    } else {
      lignes = [["Nom","Type","Ville","Adresse","Email","SIRET","Verifie","Suspendu","Missions","Inscrit le","Tarif","Actif jusqu'au","Dernier mode"]];
      annuaireData.forEach(e => lignes.push([e.nom,e.type,e.ville,e.adresse,e.email,e.siret,e.verifie?"oui":"non",e.suspendu?"oui":"non",e.missions_publiees,e.inscrit_le?new Date(e.inscrit_le).toLocaleDateString("fr-FR"):"",e.tarif,e.actif_jusqu_a?new Date(e.actif_jusqu_a).toLocaleDateString("fr-FR"):"",e.dernier_mode]));
    }
    const csv = "\uFEFF" + lignes.map(l => l.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(sep)).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });

  }

  async function sauverSection(sec) {
    const zone = document.getElementById("sec-" + sec);
    const champs = [...zone.querySelectorAll("[id^='s-']")];
    const { data: actuel } = await db.from("settings").select("key, value").in("key", ["paiement_etablissements_actif", "paiement_hotesses_actif", "paiement_en_ligne_actif"]);
    const avant = Object.fromEntries((actuel || []).map(r => [r.key, String(r.value)]));

      let v;
      if (el.type === "checkbox") v = el.checked ? "true" : "false";
      else if (el.id === "s-villes") v = JSON.stringify(el.value.split(",").map(x => x.trim()).filter(Boolean));
      else v = el.value;
      return { key: el.id.replace("s-", ""), value: v };
    });
    const { error } = await db.from("settings").upsert(upserts);
    if (error) { toast(error.message, "erreur"); return; }
    toast("Réglages enregistrés ✅", "ok");
    const apres = Object.fromEntries(upserts.map(u => [u.key, String(u.value)]));
    const allume = [["paiement_etablissements_actif", "etablissement"], ["paiement_hotesses_actif", "hotesse"]]

    }

    // mode création
    if (!nom || !email || !mdp) { msg.textContent = "Remplis le nom, l'e-mail et le mot de passe."; return; }
    msg.textContent = "Création…";
    const { data, error } = await sb.functions.invoke("membres", { body: { action: "create", nom, email, password: mdp, droits } });
    if (error || (data && data.error)) { msg.textContent = "Erreur : " + (data?.error || error?.message); return; }
    msg.textContent = "Membre créé ✅ Il peut se connecter avec son e-mail + mot de passe.";
    afficherEquipe();
  }

  async function chargerMembres() {
    const { data } = await sb.functions.invoke("membres", { body: { action: "list" } });
    membresListe = data?.data || [];
    const zone = document.getElementById("liste-membres");
    if (!zone) return;
    if (!membresListe.length) { zone.innerHTML = "Aucun membre pour l'instant."; return; }
    zone.innerHTML = `<table><tr><th>Nom</th><th>Droits</th><th></th></tr>
      ${membresListe.map(m => `<tr>
        <td>${esc(m.nom || "—")}</td>
        <td style="font-size:12.5px;color:var(--gris)">${DROITS_DISPONIBLES.filter(d => m.droits && m.droits[d.key]).map(d => d.label).join(", ") || "aucun"}</td>
        <td>
          <button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine)" onclick="editerMembre('${m.id}')">Modifier</button>
          <button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger)" onclick="supprimerMembre('${m.id}','${m.user_id}')">Retirer</button>
        </td>
      </tr>`).join("")}</table>`;
  }

  function editerMembre(id) {
    const m = membresListe.find(x => x.id === id);
    if (!m) return;
    membreEnEdition = { id };
    document.getElementById("titre-form").textContent = "Modifier : " + (m.nom || "");
    document.getElementById("m-nom").value = m.nom || "";
    document.getElementById("m-email").style.display = "none";
    document.getElementById("ligne-mdp").style.display = "none";
    document.getElementById("btn-membre").textContent = "Enregistrer les droits";
    document.querySelectorAll("#m-droits input").forEach(i => { i.checked = !!(m.droits && m.droits[i.value]); });
    document.getElementById("msg-membre").textContent = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function supprimerMembre(id, user_id) {
    if (!await demander("Retirer ce membre ? Son accès sera supprimé.")) return;
    await sb.functions.invoke("membres", { body: { action: "delete", id, user_id } });
    chargerMembres();
  }

  async function chargerAdmins() {
    const { data } = await db.from("profiles").select("id, email").eq("type", "admin");
    const zone = document.getElementById("liste-admins");
    if (!zone) return;
    const moi = (await auth.getUser()).data.user.id;
    zone.innerHTML = (data && data.length) ? `<table><tr><th>E-mail</th><th>Rôle</th><th></th></tr>
      ${data.map(a => `<tr>
        <td>${esc(a.email)}</td>
        <td><span class="badge badge-aubergine">Admin</span></td>
        <td>${a.id === moi ? '<span style="color:var(--gris);font-size:12.5px">(vous)</span>' : `<button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger)" onclick="retrograderAdmin('${a.id}')">Retirer le rôle</button>`}</td>
      </tr>`).join("")}</table>` : "Aucun administrateur.";
  }

  async function retrograderAdmin(id) {
    if (!await demander("Retirer le rôle administrateur de ce compte ?")) return;
    await db.from("profiles").update({ type: "hotesse" }).eq("id", id);
    chargerAdmins();
  }

  // ============ MISSIONS ============
  let missionsAdminListe = [];
  async function afficherMissions() {
    main.innerHTML = "<h1>Missions</h1><div class='panneau'><div class='tete'>À venir</div><div id='liste-missions' class='vide'>Chargement…</div></div>";
    const { data } = await db.from("missions").select("id, date, heure_debut, heure_fin, places_restantes, nb_hotesses, statut, medias, note, etablissements(nom)").order("date", { ascending: true });
    const aujourdhui = new Date().toISOString().slice(0, 10);
    missionsAdminListe = (data || []).filter(m => m.date >= aujourdhui && !["terminee", "annulee"].includes(m.statut));
    document.getElementById("liste-missions").innerHTML = (missionsAdminListe.length) ? `
      <table><tr><th>Établissement</th><th>Date</th><th>Horaires</th><th>Places</th><th>Statut</th><th></th></tr>
      ${missionsAdminListe.map(m => `<tr>
        <td>${esc(m.etablissements?.nom || "—")}</td>
        <td>${formatDate(m.date)}</td>
        <td>${formatHeure(m.heure_debut)}–${formatHeure(m.heure_fin)}</td>
        <td>${m.places_restantes ?? m.nb_hotesses}/${m.nb_hotesses}</td>
        <td><span class="badge badge-aubergine">${esc(m.statut)}</span></td>
        <td><button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine)" onclick="voirDetailMission('${m.id}')">📷 Détail</button> <button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger)" onclick="annulerMissionAdmin('${m.id}')">Annuler</button></td>
      </tr>`).join("")}
      </table>` : "Aucune mission à venir.";
  }
  function voirDetailMission(id) {
    const m = missionsAdminListe.find(x => x.id === id);
    if (!m) return;
    const modal = document.createElement("div");
    modal.id = "modal-mission-admin";
    modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:997";
    modal.innerHTML = `
      <div style="background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h3 style="font-family:var(--font-titre);font-size:20px">${esc(m.etablissements?.nom || "Mission")}</h3>
          <button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="document.getElementById('modal-mission-admin').remove()">✕</button>
        </div>
        <div style="font-size:13px;color:var(--gris);margin-bottom:10px">${formatDate(m.date)} · ${formatHeure(m.heure_debut)}–${formatHeure(m.heure_fin)} · ${m.places_restantes ?? m.nb_hotesses}/${m.nb_hotesses} places</div>
        ${m.note ? `<div style="background:var(--ivoire);border-radius:10px;padding:12px;margin-bottom:12px;font-size:13.5px;white-space:pre-line">📝 ${esc(m.note)}</div>` : ""}
        <b style="font-size:13px">Photos & vidéos du lieu</b>
        ${vignettesMedia(m.medias, [], "mission-" + (m.etablissements?.nom || "x").replace(/\s+/g, "-"))}
      </div>`;
    document.body.appendChild(modal);
  }
  async function annulerMissionAdmin(id) {
    const motif = prompt("Motif de l'annulation (envoyé à l'établissement et aux hôtesses) :");
    if (!motif) return;
    const { error } = await db.rpc("admin_annuler_mission", { p_mission: id, p_motif: motif });
    if (error) { toast(error.message, "erreur"); return; }
    toast("Mission annulée ✅");
    afficherMissions();
  }

  // ============ RECETTES ============
  let recettesMois = new Date().toISOString().slice(0, 7);
  let recettesMode = "tous";
  let recettesData = [];
  async function afficherRecettes() {
    main.innerHTML = `<h1>Recettes</h1>
      <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">
        <input class="field" id="r-mois" type="month" value="${recettesMois}" onchange="recettesMois=this.value;chargerRecettes()" style="max-width:180px">
        <select class="field" id="r-mode" onchange="recettesMode=this.value;chargerRecettes()" style="max-width:180px">
          <option value="tous">Tous</option><option value="especes">Espèces</option><option value="carte">Carte</option><option value="prelevement">Prélèvement</option><option value="offert">Offert</option>
        </select>
        <button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine)" onclick="exporterRecettes()">Exporter CSV</button>
        <button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine)" onclick="exporterRecettesXlsx()">Excel (.xlsx)</button>
      </div>
      <div class='panneau'><div id='liste-recettes' class='vide'>Chargement…</div></div>
      <div id="total-recettes" style="margin-top:12px;font-weight:600"></div>`;
    document.getElementById("r-mode").value = recettesMode;
    chargerRecettes();
  }
  async function chargerRecettes() {
    const { data } = await db.from("paiements").select("*").order("created_at", { ascending: false });
    recettesData = (data || []).filter(p => {
      const mois = new Date(p.created_at).toISOString().slice(0, 7);
      return (recettesMois ? mois === recettesMois : true) && (recettesMode === "tous" ? true : p.mode === recettesMode);
    });
    const total = recettesData.reduce((s, p) => s + Number(p.montant), 0);
    document.getElementById("total-recettes").innerHTML = "Total : " + total.toFixed(2) + " € (" + recettesData.length + " paiement(s))";
    document.getElementById("liste-recettes").innerHTML = recettesData.length ? `<table><tr><th>Date</th><th>Reçu</th><th>Mode</th><th>Montant</th><th>Période</th><th></th></tr>
      ${recettesData.map(p => `<tr>
        <td>${new Date(p.created_at).toLocaleDateString("fr-FR")}</td>
        <td>${esc(p.numero_recu)}</td>
        <td>${esc(p.mode)}</td>
        <td>${Number(p.montant).toFixed(2)} €</td>
        <td>${new Date(p.periode_debut).toLocaleDateString("fr-FR")} → ${new Date(p.periode_fin).toLocaleDateString("fr-FR")}</td>
        <td><a href="recu.html?id=${p.id}" target="_blank" style="color:var(--aubergine)">Reçu</a></td>
      </tr>`).join("")}</table>` : '<div class="vide">Aucun paiement.</div>';
  }
  function exporterRecettes() {
    const sep = ";";
    const lignes = [["Date","Numero recu","Mode","Montant","Periode debut","Periode fin"]];
    recettesData.forEach(p => lignes.push([new Date(p.created_at).toLocaleDateString("fr-FR"), p.numero_recu, p.mode, Number(p.montant).toFixed(2), new Date(p.periode_debut).toLocaleDateString("fr-FR"), new Date(p.periode_fin).toLocaleDateString("fr-FR")]));
    const csv = "\uFEFF" + lignes.map(l => l.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(sep)).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    telechargerOuPartager(blob, "recettes.csv", "text/csv;charset=utf-8");
  }

  function exporterRecettesXlsx() {
    const lignes = [["Date","Numero recu","Mode","Montant","Periode debut","Periode fin"]];
    recettesData.forEach(p => lignes.push([new Date(p.created_at).toLocaleDateString("fr-FR"), p.numero_recu, p.mode, Number(p.montant).toFixed(2), new Date(p.periode_debut).toLocaleDateString("fr-FR"), new Date(p.periode_fin).toLocaleDateString("fr-FR")]));
    exporterXlsx(lignes, "recettes.xlsx");
  }

  init();
</script>
</body>
</html>
