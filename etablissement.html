<!DOCTYPE html>
<html lang="fr" data-i18n-title="etablissement.titre">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DamUp</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A1120">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DamUp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { background: #140A11; display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 430px; background: var(--ivoire-2); min-height: 100vh; position: relative;
         box-shadow: 0 0 60px rgba(0,0,0,.5); display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 8px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .crown { width: 26px; }
  .brand .nom { font-family: var(--font-titre); font-size: 22px; font-weight: 700; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(140deg, var(--aubergine-3), var(--champagne));
            display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; }

  .tabs { display: flex; gap: 8px; padding: 6px 18px 12px; overflow-x: auto; }
  .tab { padding: 8px 15px; border-radius: 999px; font-size: 13.5px; background: #fff; border: 1.5px solid #EADFCC;
         color: var(--gris); cursor: pointer; white-space: nowrap; }
  .tab.on { background: var(--aubergine); color: var(--ivoire); border-color: var(--aubergine); }

  .contenu { flex: 1; padding: 4px 18px 140px; display: flex; flex-direction: column; gap: 14px; }

  /* --- formulaire publication --- */
  .pub { background: #fff; border-radius: var(--radius); padding: 16px; box-shadow: 0 6px 20px rgba(42,17,32,.08); }
  .pub h3 { font-size: 17px; margin-bottom: 12px; }
  .ligne { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .offres-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .offres-grid label { display: flex; align-items: center; gap: 6px; font-size: 13.5px; background: var(--ivoire);
                       padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .offres-grid input { accent-color: var(--aubergine); }

  /* --- cartes mission --- */
  .mission { background: #fff; border-radius: var(--radius); padding: 15px 16px; box-shadow: 0 6px 20px rgba(42,17,32,.08); }
  .mission .t { display: flex; justify-content: space-between; align-items: center; }
  .mission h4 { font-size: 16px; }
  .mission .meta { color: var(--gris); font-size: 13px; margin: 6px 0; }

  /* --- swipe --- */
  .swipe-titre { display: flex; justify-content: space-between; align-items: baseline; }
  .swipe-titre h3 { font-size: 18px; }
  .swipe-titre .cpt { color: var(--gris); font-size: 13px; }
  .carte { position: relative; border-radius: 22px; overflow: hidden; box-shadow: 0 14px 40px rgba(42,17,32,.2);
           background: linear-gradient(150deg, #4E223F, #2A1120); height: 440px; color: var(--ivoire); }
  .carte .photo { height: 100%; display: flex; align-items: center; justify-content: center; }
  .carte .initiale { font-family: var(--font-titre); font-size: 110px; color: rgba(244,232,214,.9); }
  .carte .gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(30,12,23,.95) 0%, rgba(30,12,23,0) 55%); }
  .carte .infos { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; }
  .carte .infos h3 { font-size: 24px; }
  .carte .infos .sous { font-size: 14px; opacity: .85; margin-top: 2px; }
  .actions { display: flex; justify-content: center; gap: 22px; padding: 18px 0 6px; }
  .act { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; font-size: 25px;
         display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(42,17,32,.18); }
  .act.non { background: #fff; }
  .act.oui { background: var(--aubergine); color: var(--champagne); }

  .vide { text-align: center; color: var(--gris); padding: 50px 20px; font-size: 15px; }

  /* --- dashboard --- */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { background: #fff; border-radius: var(--radius-sm); padding: 16px; box-shadow: 0 4px 14px rgba(42,17,32,.06); }
  .stat .v { font-family: var(--font-titre); font-size: 26px; font-weight: 700; }
  .stat .l { color: var(--gris); font-size: 12.5px; }

  .bottomnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px;
               background: #fff; border-top: 1px solid #EEE4D2; display: flex; justify-content: space-around; padding: 10px 0 calc(14px + env(safe-area-inset-bottom)); }
  .bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--gris); text-decoration: none; }
  .bottomnav a.on { color: var(--aubergine); font-weight: 600; }
  .bottomnav .ico { font-size: 20px; }
  .topbar, .tabs { flex-shrink: 0; }
  .tabs, .filtres { scrollbar-width: none; }
  .tabs::-webkit-scrollbar, .filtres::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><img class="crown" src="assets/logo-couronne.png" alt=""><span class="nom">DamUp</span></div>
    <div style="display:flex;align-items:center;gap:12px">
      <div id="sel-langue"></div>
      <button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="ouvrirMessages()">💬</button>
      <div id="cloche"></div>
      <div class="avatar" id="avatar">?</div>
    </div>
  </div>

  <div class="tabs">
    <span class="tab on" data-vue="missions">📋 <span data-i18n="nav.missions">Missions</span></span>
    <span class="tab" data-vue="selection">✨ <span data-i18n="nav.selection">Sélection</span></span>
    <span class="tab" data-vue="accueil">📷 <span data-i18n="nav.accueil">Accueil</span></span>
    <span class="tab" data-vue="dashboard">📊 <span data-i18n="nav.dashboard">Dashboard</span></span>
    <span class="tab" data-vue="profil">👤 <span data-i18n="nav.profil">Profil</span></span>
  </div>

  <div class="contenu" id="contenu"></div>

  <nav class="bottomnav">
    <a href="#" class="on" id="nav-missions"><span class="ico">📋</span><span data-i18n="nav.missions">Missions</span></a>
    <a href="#" id="nav-selection"><span class="ico">✨</span><span data-i18n="nav.selection">Sélection</span></a>
    <a href="#" id="nav-accueil"><span class="ico">📷</span><span data-i18n="nav.accueil">Accueil</span></a>
    <a href="#" id="nav-dashboard"><span class="ico">📊</span><span data-i18n="nav.dashboard">Dashboard</span></a>
    <a href="#" id="logout"><span class="ico">🚪</span><span data-i18n="nav.quitter">Quitter</span></a>
  </nav>
</div>

<script src="js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/ui.js"></script>
<script src="js/install.js"></script>
<script src="js/push.js"></script>
<script src="js/notifications.js"></script>
<script src="js/messages.js"></script>
<script>
  const contenu = document.getElementById("contenu");
  let user = null, etab = null, vue = "missions";
  let mediasEnCours = [];

  const ICONES = { boisson:"🍸", entree:"🥗", plat:"🍴", dessert:"🍰", chicha:"💨" };

  async function init() {
    const codeScan = (location.hash.match(/#scan=([a-zA-Z0-9]+)/) || [])[1] || null;
    const { data } = await auth.getUser();
    if (!data.user) {
      if (codeScan) { try { localStorage.setItem("damup_scan_pending", codeScan); } catch (e) {} }
      location.href = "login.html";
      return;
    }
    user = data.user;
    const { data: p } = await db.from("profiles").select("type, langue").eq("id", user.id).single();
    if (p?.langue) appliquerLangueCompte(p.langue);
    if (!p || p.type !== "etablissement") {
      if (codeScan) {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Jost,sans-serif;color:#2A1120;text-align:center;padding:20px"><div style="font-size:16px">⚠️<br><b>Ce QR code doit être scanné par l\'établissement à ton arrivée.</b></div></div>';
        return;
      }
      location.href = "hotesse.html";
      return;
    }
    const { data: e } = await db.from("etablissements").select("id, nom, type, adresse, ville, siret, photos, videos, verifie, abonnement_actif, created_at").eq("id", user.id).single();
    etab = e;
    document.getElementById("avatar").textContent = (e?.nom || "?")[0].toUpperCase();
    afficher();
    initCloche("cloche", user.id);

    // validation de présence si un code arrive (scan direct ou reconnexion)
    let codeAValider = codeScan;
    if (!codeAValider) { try { codeAValider = localStorage.getItem("damup_scan_pending"); if (codeAValider) localStorage.removeItem("damup_scan_pending"); } catch (e) {} }
    if (codeAValider) {
      vue = "accueil";
      afficher();
      validerPresenceCode(codeAValider);
      history.replaceState(null, "", location.pathname + location.search);
    }
  }

  function afficher() {
    document.querySelectorAll(".tabs .tab").forEach(t => t.classList.toggle("on", t.dataset.vue === vue));
    if (vue === "missions") afficherMissions();
    else if (vue === "selection") afficherSelection();
    else if (vue === "accueil") afficherAccueil();
    else if (vue === "dashboard") afficherDashboard();
    else if (vue === "profil") afficherProfil();
    }
  document.querySelectorAll(".tabs .tab").forEach(t => t.addEventListener("click", () => { vue = t.dataset.vue; afficher(); }));
  document.querySelectorAll("[id^=nav-]").forEach(a => a.addEventListener("click", (e) => {
    if (a.id === "logout") return; e.preventDefault();
    vue = a.id.replace("nav-",""); afficher();
  }));
  document.getElementById("logout").addEventListener("click", async () => { await auth.signOut(); location.href = "index.html"; });

  // ============ MISSIONS ============
  function afficherMissions() {
    mediasEnCours = [];
    contenu.innerHTML = `
      <div class="pub">
        <h3>Publier une mission</h3>
        <div class="champ"><label class="label">📅 Date</label><input class="field" id="m-date" type="date"></div>
        <div class="ligne">
          <div class="champ"><label class="label">🕐 Début</label><input class="field" id="m-debut" type="time" value="20:00"></div>
          <div class="champ"><label class="label">🕐 Fin</label><input class="field" id="m-fin" type="time" value="23:00"></div>
        </div>
        <div class="champ"><label class="label">👥 Nombre d'hôtesses</label><input class="field" id="m-nb" type="number" min="1" value="2"></div>
        <div class="champ"><label class="label">📍 Adresse du lieu</label><input class="field" id="m-adresse" placeholder="12 rue Oberkampf, Paris"></div>
        <div class="champ"><label class="label">🍽️ Articles offerts</label>
          <div class="offres-grid">
            ${Object.keys(ICONES).map(a => `<label><input type="checkbox" value="${a}"> ${ICONES[a]} ${LIBELLES_ARTICLES[a]||a}</label>`).join("")}
          </div>
        </div>
        <div id="apercu-medias" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"></div>
      <button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine);margin-top:10px" onclick="ajouterMediaMission()">＋ Ajouter photos/vidéos (obligatoire)</button>
      <div class="champ" style="margin-top:12px">
        <label class="label">📝 Note pour les hôtesses (facultatif)</label>
        <textarea class="field" id="m-note" rows="3" maxlength="500" placeholder="Ex. : tenue noire élégante, rendez-vous à l'entrée VIP à 21h45, soirée à thème…" style="width:100%" oninput="document.getElementById('m-note-cpt').textContent = this.value.length + ' / 500'"></textarea>
        <div style="text-align:right;font-size:12px;color:var(--gris)" id="m-note-cpt">0 / 500</div>
      </div>
      <button class="btn btn-primaire btn-block btn-sm" onclick="publierMission()" style="margin-top:12px">Publier</button>
      </div>
      <div id="liste-missions"></div>`;
    chargerMissions();
  }

  async function ajouterMediaMission() {
    const input = document.createElement("input");
    input.type = "file"; input.accept = "image/*,video/*"; input.multiple = true;
    input.onchange = async () => {
      for (const f of input.files) {
        if (f.size > 50 * 1024 * 1024) { toast("Vidéo de plus de 50 Mo refusée.", "erreur"); continue; }
        let fichier = f;
        if (f.type.startsWith("image/")) { try { fichier = await redimensionnerImage(f); } catch (e) { toast("Image invalide.", "erreur"); continue; } }
        const path = `${user.id}/mission-${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g, "")}`;
        const { error } = await sb.storage.from("photos").upload(path, fichier);
        if (error) { toast("Erreur : " + error.message, "erreur"); continue; }
        mediasEnCours.push(`${SB_URL}/storage/v1/object/public/photos/${path}`);
      }
      afficherApercuMedias();
    };
    input.click();
  }

  function afficherApercuMedias() {
    const zone = document.getElementById("apercu-medias");
    if (!zone) return;
    zone.innerHTML = mediasEnCours.map(m => `<div style="width:60px;height:60px;border-radius:10px;background-image:url('${urlPhoto(m)}');background-size:cover;background-position:center"></div>`).join("");
  }

  async function publierMission() {
    const articles = [...document.querySelectorAll(".offres-grid input:checked")].map(i => i.value);
    const date = document.getElementById("m-date").value;
    const debut = document.getElementById("m-debut").value;
    const fin = document.getElementById("m-fin").value;
    const nb = parseInt(document.getElementById("m-nb").value || "2");
    const adresse = document.getElementById("m-adresse").value || (etab?.adresse || "");

    if (!date) { toast("Choisis une date."); return; }
    if (date < new Date().toISOString().slice(0, 10)) { toast("La date de la mission est déjà passée."); return; }
    if (!debut || !fin) { toast("Renseigne l'heure de début et de fin."); return; }
    if (debut === fin) { toast("L'heure de début doit être différente de l'heure de fin."); return; }
    if (nb < 1 || nb > 50) { toast("Le nombre d'hôtesses doit être entre 1 et 50."); return; }
    if (!adresse || !adresse.trim()) { toast("L'adresse est obligatoire pour publier."); return; }
    if (!mediasEnCours.length) { toast("Ajoute au moins une photo ou vidéo : c'est obligatoire pour publier."); return; }
    if (fin < debut) {
      if (!await demander("La mission se termine le lendemain à " + formatHeure(fin) + ". Continuer ?")) return;
    }

    const note = (document.getElementById("m-note")?.value || "").trim();
    const payload = {
      etablissement_id: user.id,
      date, heure_debut: debut, heure_fin: fin,
      adresse, nb_hotesses: nb,
      articles_offerts: articles,
      medias: mediasEnCours,
      note: note || null,
      statut: "ouverte"
    };
    const { error } = await db.from("missions").insert(payload);
    if (error) { toast(error.message, "erreur"); return; }
    toast("Mission publiée ✅");
    afficherMissions();
  }

  async function chargerMissions() {
    const { data } = await db.from("missions").select("*").eq("etablissement_id", user.id).order("date", { ascending: true });
    const zone = document.getElementById("liste-missions");
    if (!zone) return;
    if (!data || !data.length) { zone.innerHTML = '<div class="vide">Aucune mission publiée pour l\'instant.</div>'; return; }
    zone.innerHTML = data.map(m => `
      <div class="mission">
        <div class="t"><h4>📅 ${formatDate(m.date)} · ${formatHeure(m.heure_debut)}–${formatHeure(m.heure_fin)}</h4>
          <span class="badge badge-aubergine">${m.statut}</span></div>
        <div class="meta">📍 ${esc(m.adresse)} · ${m.nb_hotesses} hôtesse(s) · ${(m.articles_offerts||[]).map(a=>LIBELLES_ARTICLES[a]||a).join(", ")}</div>
        ${m.note ? `<div class="meta" style="white-space:pre-line">📝 ${esc(m.note)}</div>` : ""}
        <button class="btn btn-sm" style="background:var(--champagne);color:var(--aubergine)" onclick="modifierNoteMission('${m.id}')">📝 Modifier la note</button>
        <button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger)" onclick="annulerMission('${m.id}')">Annuler</button>
      </div>`).join("");
  }

  async function annulerMission(id) {
    if (!await demander("Annuler cette mission ?")) return;
    await db.from("missions").update({ statut: "annulee" }).eq("id", id);
    chargerMissions();
  }

  function modifierNoteMission(id) {
    db.from("missions").select("note").eq("id", id).single().then(({ data: m }) => {
      const modal = document.createElement("div");
      modal.id = "modal-note";
      modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:998;padding:20px";
      modal.innerHTML = `
        <div style="background:#fff;border-radius:16px;padding:20px;width:100%;max-width:400px">
          <h3 style="margin-bottom:12px">📝 Note pour les hôtesses</h3>
          <textarea id="note-texte" maxlength="500" rows="4" style="width:100%;border:1px solid #EEE4D2;border-radius:8px;padding:10px;font-size:14px">${esc(m?.note || "")}</textarea>
          <div style="text-align:right;font-size:12px;color:var(--gris);margin:4px 0 12px" id="note-cpt">${(m?.note || "").length} / 500</div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-block" style="background:#EEE" onclick="document.getElementById('modal-note').remove()">Annuler</button>
            <button class="btn btn-block btn-primaire" onclick="enregistrerNoteMission('${id}')">Enregistrer</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
      const ta = document.getElementById("note-texte");
      ta.oninput = () => { document.getElementById("note-cpt").textContent = ta.value.length + " / 500"; };
    });
  }
  async function enregistrerNoteMission(id) {
    const v = document.getElementById("note-texte").value.trim();
    const { error } = await db.from("missions").update({ note: v || null }).eq("id", id);
    if (error) { toast(error.message, "erreur"); return; }
    document.getElementById("modal-note")?.remove();
    toast("Note mise à jour ✅");
    chargerMissions();
  }

  // ============ SÉLECTION (swipe) ============
  async function afficherSelection() {
    contenu.innerHTML = '<div class="swipe-titre"><h3>Candidates à tes missions</h3><span class="cpt">Chargement…</span></div><div id="swipe-zone"></div>';
    // candidatures en attente sur les missions de cet établissement
    const { data: cands } = await db.from("candidatures")
      .select("*, hotesses(prenom, age, ville, note_moyenne, nb_avis, photos, missions_honorees, nb_retards, nb_absences), missions(date, heure_debut)")
      .eq("statut", "en_attente")
      .order("created_at");
    // filtrer : missions de CET établissement
    const { data: mesMissions } = await db.from("missions").select("id").eq("etablissement_id", user.id);
    const mesIds = new Set((mesMissions || []).map(m => m.id));
    const mes = (cands || []).filter(c => mesIds.has(c.mission_id));
    const zone = document.getElementById("swipe-zone");
    document.querySelector(".swipe-titre .cpt").textContent = mes.length + " candidate(s)";
    if (!mes.length) { zone.innerHTML = '<div class="vide">Aucune candidate en attente.</div>'; return; }
    afficherCarte(mes, 0);
  }

  function afficherCarte(mes, i) {
    const zone = document.getElementById("swipe-zone");
    if (i >= mes.length) { zone.innerHTML = '<div class="vide">Toutes les candidates ont été vues 🎉</div>'; return; }
    const c = mes[i], h = c.hotesses;
    const photo = urlPhoto(h.photos && h.photos[0]) ? `<img src="${urlPhoto(h.photos && h.photos[0])}" style="width:100%;height:100%;object-fit:cover">` : `<span class="initiale">${esc((h.prenom||"?")[0].toUpperCase())}</span>`;
    zone.innerHTML = `
      <div class="carte" onclick="ouvrirFicheCandidate('${c.id}')">
        <div class="photo">${photo}</div>
        <div class="gradient"></div>
        <div class="infos">
          <h3>${esc(h.prenom)}, ${h.age}</h3>
          <div class="sous">📍 ${esc(h.ville || "")} · ⭐ ${h.note_moyenne ?? 5} (${h.nb_avis ?? 0} avis)</div>
          <div class="sous">🛡️ ${h.missions_honorees ?? 0} missions · ${h.nb_retards ?? 0} retard · ${h.nb_absences ?? 0} absence</div>
          <div class="sous">Mission du ${formatDate(c.missions?.date)} à ${formatHeure(c.missions?.heure_debut)}</div>
        </div>
      </div>
      <div class="actions">
        <button class="act non" onclick="decider('${c.id}','refusee')">✕</button>
        <button class="act oui" onclick="decider('${c.id}','acceptee')">♥</button>
      </div>`;
  }

  async function decider(candId, statut) {
    const { error } = await db.from("candidatures").update({ statut }).eq("id", candId);
    if (error) { toast(error.message, "erreur"); return; }
    afficherSelection(); // recharge le lot restant
  }

  // ============ DASHBOARD ============
  async function afficherDashboard() {
    contenu.innerHTML = '<div id="stats"></div><div id="a-noter"></div>';
    const { data: missions } = await db.from("missions").select("id, statut").eq("etablissement_id", user.id);
    const { data: cands } = await db.from("candidatures").select("id, statut, mission_id");
    const mesIds = new Set((missions||[]).map(m => m.id));
    const mesCands = (cands||[]).filter(c => mesIds.has(c.mission_id));

  async function ajouterPhotoEtab() {

    input.type = "file"; input.accept = "image/*"; input.multiple = true;

      let photos = [...(etab?.photos || [])];

      etab.photos = photos;
      chargerProfilEtab();
    };

  async function chargerAConfirmer() {
    const zone = document.getElementById("liste-a-confirmer");
    if (!zone) return;
    const { data: cands } = await db.from("candidatures")
      .select("id, hotesses(prenom, photos), missions(date, heure_debut, heure_fin)")
      .eq("statut", "confirmee")
      .eq("annulation", false)
      .is("presente_a", null)
      .is("absence_declaree_le", null);
    const { data: mesMissions } = await db.from("missions").select("id").eq("etablissement_id", user.id);
    const mesIds = new Set((mesMissions || []).map(m => m.id));
    const maintenant = Date.now();
    const liste = (cands || []).filter(c => {
      if (!mesIds.has(c.mission_id)) return false;
      const m = c.missions;
      const fin = new Date(m.date + "T" + (m.heure_fin || "00:00"));
      if (m.heure_fin <= m.heure_debut) fin.setDate(fin.getDate() + 1);
      const diff = maintenant - fin.getTime();
      return diff >= 0 && diff < 24 * 3600 * 1000;
    });
    zone.innerHTML = liste.length
      ? liste.map(c => {
          const h = c.hotesses;
          const photo = urlPhoto(h?.photos?.[0]);
          const d = c.missions?.date ? new Date(c.missions.date + "T00:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : "";
          return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F1E9DA">
            <div style="width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--champagne);flex-shrink:0">${photo ? `<img src="${photo}" style="width:100%;height:100%;object-fit:cover">` : esc((h?.prenom || "?")[0])}</div>
            <div style="flex:1;min-width:0"><b>${esc(h?.prenom || "?")}</b><div style="font-size:11px;color:var(--gris)">${d}</div></div>
            <button class="btn btn-sm" style="background:#E7F5EC;color:#1E7A3C;white-space:nowrap" onclick="declarerAbsence('${c.id}', true)">✅ venue</button>
            <button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger);white-space:nowrap" onclick="declarerAbsence('${c.id}', false)">❌ absente</button>
          </div>`;
        }).join("")
      : '<div style="color:var(--gris);font-size:12.5px">Rien à confirmer.</div>';
  }

  async function demarrerScan() {
    if (!window.Html5Qrcode) { toast("Lecteur QR indisponible."); return; }
    if (scanner) { try { await scanner.stop(); scanner.clear(); } catch (e) {} scanner = null; }
    const ov = document.createElement("div");
    ov.id = "scan-overlay";
    ov.style.cssText = "position:fixed;inset:0;background:#000;z-index:1000;display:flex;flex-direction:column";
    ov.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;color:#fff">
        <span style="font-size:15px;font-weight:600">Scanner un QR code</span>
        <button onclick="arreterScan()" style="background:rgba(255,255,255,.18);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer">✕</button>
      </div>
      <div style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden">
        <div id="reader" style="width:100%;max-width:430px"></div>
        <div id="cadre-visee" style="position:absolute;width:230px;height:230px;border:3px solid #E7CFA8;border-radius:20px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);pointer-events:none"></div>
      </div>
      <div style="padding:12px 16px 30px;color:#fff;text-align:center;font-size:14px">Vise le QR code de l'hôtesse</div>`;
    document.body.appendChild(ov);
    scanner = new Html5Qrcode("reader");
    try {
      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 230, height: 230 } },
        async (texteLu) => { await validerPresenceCode(texteLu); },
        () => {}
      );
    } catch (e) {
      const cadre = document.getElementById("cadre-visee"); if (cadre) cadre.style.display = "none";
      document.getElementById("reader").innerHTML = '<div style="color:#fff;text-align:center;padding:24px">Impossible d\'accéder à la caméra.<br><button class="btn btn-sm" style="margin-top:14px;background:var(--champagne);color:var(--aubergine)" onclick="arreterScan()">Fermer</button></div>';
    }
  }

  function arreterScan() {
    if (scanner) { try { scanner.stop(); scanner.clear(); } catch (e) {} scanner = null; }
    document.getElementById("scan-overlay")?.remove();
    document.getElementById("carte-resultat")?.remove();
    chargerPresences();
  }

  async function validerCodeManuel() {

    await validerPresenceCode(code);

  async function validerPresenceCode(code) {
    const t = (code || "").trim();
    const vraiCode = (t.match(/#scan=([a-zA-Z0-9]+)/) || [])[1] || t;
    const { data, error } = await db.rpc("valider_presence", { p_code: vraiCode });
    if (error) { toast(error.message); return; }
    afficherResultatScan(data);
    chargerPresences();
  }

  function bip(freq, duree) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq; g.gain.value = 0.15;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + duree);
    } catch (e) {}
  }

  function afficherResultatScan(res) {
    if (scanner) { try { scanner.pause(); } catch (e) {} }
    const vib = res.statut === "erreur" ? [130, 60, 130] : 80;
    try { navigator.vibrate(vib); } catch (e) {}
    if (res.statut === "ok") bip(880, 0.15);
    else if (res.statut === "retard" || res.statut === "deja") bip(660, 0.15);
    else bip(200, 0.3);

    const cfg = {
      ok:     { fond: "#1E7A3C", icone: "✅", titre: "Bienvenue " + esc(res.prenom || "") + " !" },
      retard: { fond: "#E67E22", icone: "🟠", titre: esc(res.prenom || "") + " est arrivée avec " + (res.retard_min || 0) + " min de retard (" + (res.retard_prevenu ? "prévenu" : "non prévenu") + ")" },
      deja:   { fond: "#E67E22", icone: "🟠", titre: esc(res.prenom || "") + " est déjà enregistrée (arrivée à " + (res.heure_arrivee || "") + ")" },
      erreur: { fond: "#C0392B", icone: "🔴", titre: esc(res.message || "Erreur") },
    }[res.statut] || { fond: "#C0392B", icone: "🔴", titre: esc(res.message || "Erreur") };
    const photo = urlPhoto(res.photo);
    const carte = document.createElement("div");
    carte.id = "carte-resultat";
    carte.style.cssText = "position:fixed;inset:0;z-index:1001";
    carte.innerHTML = `
      <div style="position:absolute;inset:0;background:${cfg.fond};display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff">
        <div style="font-size:56px">${cfg.icone}</div>
        <div style="font-size:22px;font-weight:700;margin-top:14px;line-height:1.3;max-width:320px">${cfg.titre}</div>
        ${photo ? `<img src="${photo}" style="width:150px;height:150px;border-radius:50%;object-fit:cover;margin-top:20px;border:3px solid rgba(255,255,255,.6)">` : ""}
        ${res.date_mission ? `<div style="font-size:14px;margin-top:16px;opacity:.9">Mission du ${esc(res.date_mission)}</div>` : ""}
        <div style="display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;justify-content:center">
          ${res.statut !== "erreur" ? `<button class="btn" style="background:#fff;color:${cfg.fond};font-weight:600" onclick="relancerScan()">Scanner la suivante</button>` : ""}
          <button class="btn" style="background:rgba(255,255,255,.22);color:#fff;font-weight:600" onclick="arreterScan()">Terminer</button>
        </div>
      </div>`;
    document.body.appendChild(carte);
  }

  function relancerScan() {
    document.getElementById("carte-resultat")?.remove();
    if (scanner) { try { scanner.resume(); } catch (e) {} return; }
    demarrerScan();
  }

  async function ouvrirFicheCandidate(candId) {
    const { data: cand } = await db.from("candidatures")
      .select("id, mission_id, hotesse_id, hotesses(prenom, age, ville, note_moyenne, nb_avis, photos), missions(date, heure_debut, heure_fin, etablissements(nom))")
      .eq("id", candId).single();
    if (!cand) return;
    const c = cand, h = c.hotesses, m = c.missions;
    const { data: avis } = await db.from("avis")
      .select("note, criteres, commentaire, etablissements(nom)")
      .eq("hotesse_id", c.hotesse_id).order("created_at", { ascending: false }).limit(5);
    const galerie = (h?.photos || []).map(p => urlPhoto(p)).filter(Boolean);
    const modal = document.createElement("div");
    modal.id = "modal-fiche";
    modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:998";
    modal.innerHTML = `
      <div style="background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h3 style="font-family:var(--font-titre);font-size:20px">${esc(h?.prenom || "?")}, ${h?.age || ""}</h3>
          <button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="document.getElementById('modal-fiche').remove()">✕</button>
        </div>
        <div style="color:var(--gris);font-size:13px">📍 ${esc(h?.ville || "")} · ⭐ ${h?.note_moyenne ?? 5} (${h?.nb_avis ?? 0} avis)</div>
        <div style="color:var(--gris);font-size:13px;margin-top:2px">Mission du ${formatDate(m?.date)} à ${formatHeure(m?.heure_debut)}</div>
        <div style="display:flex;gap:6px;overflow-x:auto;margin:14px 0">
          ${galerie.length ? galerie.map(p => `<img src="${p}" style="width:120px;height:160px;object-fit:cover;border-radius:10px;flex-shrink:0">`).join("") : '<div style="color:var(--gris);font-size:13px">Aucune photo.</div>'}
        </div>
        <div style="margin-top:14px">
          <div style="font-weight:600;font-size:14px;margin-bottom:8px">Avis récents</div>
          ${(avis && avis.length) ? avis.map(a => `
            <div style="background:#FBF6EE;border-radius:10px;padding:10px 12px;margin-bottom:8px">
              <div style="display:flex;justify-content:space-between;font-size:12.5px"><b>${esc(a.etablissements?.nom || "")}</b><span style="color:var(--champagne-2)">${"★".repeat(a.note || 0)}</span></div>
              ${a.criteres && a.criteres.length ? `<div style="font-size:11.5px;color:var(--gris);margin:4px 0">${(a.criteres||[]).map(esc).join(" · ")}</div>` : ""}
              ${a.commentaire ? `<div style="font-size:12.5px;margin-top:4px">${esc(a.commentaire)}</div>` : ""}
            </div>`).join("") : '<div style="color:var(--gris);font-size:12.5px">Aucun avis pour le moment.</div>'}
        </div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn btn-block" style="background:#FBE4E1;color:var(--danger)" onclick="deciderDepuisFiche('${c.id}','refusee')">Refuser</button>
          <button class="btn btn-block btn-primaire" onclick="deciderDepuisFiche('${c.id}','acceptee')">Accepter</button>
        </div>
        <button class="btn btn-block" style="background:#FBE4E1;color:var(--danger);margin-top:8px" onclick="ouvrirSignalement('hotesse', '${c.hotesse_id}')">🚩 Signaler</button>
      </div>`;
    document.body.appendChild(modal);
  }

  function chargerPartenaire() {
    try {
      db.from("settings").select("value").eq("key", "partenaire_lien").single().then(({ data }) => {
        const lien = (data && data.value || "").trim();
        const zone = document.getElementById("partenaire-suivi");
        if (!zone) return;
        if (!lien) { zone.innerHTML = ""; return; }
        zone.innerHTML = `<a href="${esc(lien)}" target="_blank" rel="noopener" style="color:var(--aubergine);font-weight:600">📸 Suivre notre partenaire</a>`;
      });
    } catch (e) {}
  }
  async function chargerMesFactures() {
    const zone = document.getElementById("mes-factures");
    if (!zone) return;
    const { data } = await db.from("factures").select("*").eq("profil_id", user.id).order("date_emission", { ascending: false });
    if (!data || !data.length) { zone.innerHTML = '<div style="color:var(--gris);font-size:12.5px">Aucune facture.</div>'; return; }
    zone.innerHTML = data.map(f => `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px solid #F1E9DA">
      <span>${esc(f.numero)} · ${new Date(f.date_emission).toLocaleDateString("fr-FR")} · ${new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" }).format(Number(f.total))}</span>
      <a style="color:var(--aubergine);cursor:pointer" onclick="telechargerFactureEtab('${(f.pdf_chemin || "").replace(/'/g, "")}')">Télécharger</a>
    </div>`).join("");
  }
  async function telechargerFactureEtab(chemin) {
    if (!chemin) { toast("PDF pas encore généré."); return; }
    const { data, error } = await sb.storage.from("factures").createSignedUrl(chemin, 3600);
    if (error) { toast(error.message, "erreur"); return; }
    window.open(data.signedUrl, "_blank");
  }

  chargerDicts().then(() => initSelecteurLangue("sel-langue"));
  init();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
