<!DOCTYPE html>
<html lang="fr" data-i18n-title="hotesse-profil.titre">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DamUp</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A1120">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DamUp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { background: var(--ivoire-2); display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 430px; background: var(--ivoire-2); min-height: 100vh; position: relative;
         box-shadow: 0 0 60px rgba(0,0,0,.5); display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .crown { width: 26px; }
  .brand .nom { font-family: var(--font-titre); font-size: 22px; font-weight: 700; }
  .back { font-size: 20px; color: var(--aubergine); text-decoration: none; }
  .head { display: flex; align-items: center; gap: 15px; padding: 10px 18px 6px; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(140deg, var(--champagne), var(--aubergine-3));
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 28px; font-weight: 600; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .head h1 { font-size: 21px; }
  .head .sub { color: var(--gris); font-size: 13px; }
  .note { margin-left: auto; text-align: center; }
  .note .n { font-family: var(--font-titre); font-size: 25px; font-weight: 700; }
  .note .s { color: var(--champagne-2); font-size: 13px; }
  .note .c { color: var(--gris); font-size: 11px; }

  .section { padding: 12px 18px; }
  .section h2 { font-size: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 18px 6px; }
  .photos .p { aspect-ratio: 3/4; border-radius: 12px; background: linear-gradient(140deg,#4E223F,#2A1120);
                background-size: cover; background-position: center; position: relative; }
  .photos .p.add { display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; cursor: pointer;
                   background: rgba(42,17,32,.4); border: 2px dashed var(--champagne); }
  .photos .p .del { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,.5); color: #fff; width: 22px; height: 22px;
                    border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }

  .avis { background: #fff; border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 9px; box-shadow: 0 4px 14px rgba(42,17,32,.06); }
  .avis .t { display: flex; justify-content: space-between; font-size: 13.5px; }
  .avis .e { font-weight: 600; }
  .avis .st { color: var(--champagne-2); }
  .avis .txt { font-size: 13px; color: var(--gris); margin-top: 4px; }

  .qrcard { background: linear-gradient(150deg, var(--aubergine), var(--aubergine-2)); color: var(--ivoire);
            border-radius: var(--radius); padding: 20px; text-align: center; margin: 4px 18px 90px; }
  .qrcard h2 { font-family: var(--font-titre); font-size: 19px; }
  .qrcard .sous { font-size: 13px; opacity: .75; margin: 4px 0 14px; }
  .qrcard img { width: 180px; height: 180px; margin: 0 auto 14px; border-radius: 10px; background: #fff; padding: 8px; }
  .qrcard .info { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
  .qrcard .info b { color: var(--champagne); }

  #form-edit { display: none; background: #fff; border-radius: var(--radius-sm); padding: 16px; margin: 0 18px; box-shadow: 0 4px 14px rgba(42,17,32,.08); }
  #form-edit.visible { display: block; }
  .ligne { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bottomnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px;
               background: #fff; border-top: 1px solid #EEE4D2; display: flex; justify-content: space-around; padding: 10px 0 calc(14px + env(safe-area-inset-bottom)); }
  .bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--gris); text-decoration: none; }
  .bottomnav a.on { color: var(--aubergine); font-weight: 600; }
  .bottomnav .ico { font-size: 20px; }
  .topbar, .head { flex-shrink: 0; }
</style>
</head>
<body>
<div id="sel-langue" style="position:fixed;top:14px;right:16px;z-index:300;color:var(--aubergine)"></div>
<div class="app">
  <div class="topbar">
    <a class="back" href="hotesse.html">‹</a>
    <div class="brand"><img class="crown" src="assets/logo-couronne.png" alt=""><span class="nom">DamUp</span></div>
    <div style="width:20px"></div>
  </div>

  <div class="head" id="head"></div>

  <div class="section"><h2>Mes photos <span id="compteur-photos"></span> <a style="font-size:12.5px;color:var(--aubergine);cursor:pointer;font-weight:600" onclick="ajouterPhotos()">＋ Ajouter</a></h2></div>
  <div class="photos" id="photos"></div>

  <div class="section"><h2><span data-i18n="profil.mon_profil">Mon profil</span> <a style="font-size:12.5px;color:var(--aubergine);cursor:pointer;font-weight:600" onclick="ouvrirEdit()" data-i18n="commun.modifier">✏️ Modifier</a></h2></div>
  <div id="form-edit">
    <div class="champ"><label class="label" data-i18n="commun.prenom">Prénom</label><input class="field" id="e-prenom"></div>
    <div class="ligne">
      <div class="champ"><label class="label" data-i18n="commun.age">Âge</label><input class="field" type="number" id="e-age" min="18"></div>
      <div class="champ"><label class="label" data-i18n="commun.ville">Ville</label><input class="field" id="e-ville"></div>
    </div>
    <div class="ligne">
      <div class="champ"><label class="label" data-i18n="commun.telephone">Téléphone</label><input class="field" id="e-tel"></div>
      <div class="champ"><label class="label" data-i18n="commun.instagram">Instagram</label><input class="field" id="e-insta"></div>
    </div>
    <button class="btn btn-primaire btn-block btn-sm" onclick="sauverProfil()" data-i18n="commun.enregistrer">Enregistrer</button>
  </div>

  <div class="section"><h2 data-i18n="profil.avis">Avis des établissements</h2><div id="avis"></div></div>
  <div class="section"><h2 data-i18n="profil.mes_missions">Mes missions</h2><div id="mes-missions"></div></div>
  <div class="section"><h2 data-i18n="profil.ma_mission">Ma mission, à présenter à l'entrée</h2></div>
  <div class="qrcard" id="qr"></div>

  <div id="bloc-abonnement"></div>
  <div id="partenaire-suivi" style="text-align:center;margin:14px 0"></div>
  <div style="text-align:center;margin:8px 0 14px"><a style="color:var(--aubergine);cursor:pointer;font-weight:600" onclick="demanderInstallation()" data-i18n="commun.installer">📲 Installer l'application</a></div>

  <nav class="bottomnav">
    <a href="hotesse.html"><span class="ico">🏠</span><span data-i18n="nav.missions">Missions</span></a>
    <a href="#" class="on"><span class="ico">👤</span><span data-i18n="nav.profil">Profil</span></a>
    <a href="#" id="logout"><span class="ico">🚪</span><span data-i18n="nav.quitter">Quitter</span></a>
  </nav>
</div>

<script src="js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/ui.js"></script>
<script src="js/install.js"></script>
<script>
  let user = null, profil = null;

  async function init() {
    const { data } = await auth.getUser();
    if (!data.user) { location.href = "login.html"; return; }
    user = data.user;
    const { data: pr } = await db.from("profiles").select("langue").eq("id", user.id).single();
    if (pr?.langue) appliquerLangueCompte(pr.langue);
    await chargerProfil();
    chargerAvis();
    chargerMesMissions();
    chargerQR();
    afficherBlocAbonnement("bloc-abonnement");
  }

  async function chargerProfil() {
    const { data: h } = await db.from("hotesses").select("id, prenom, age, ville, photos, note_moyenne, nb_avis, verifie, created_at").eq("id", user.id).single();
    const { data: priv } = await db.rpc("hotesse_prive", { p_id: user.id });
    if (priv && priv.length) { h.telephone = priv[0].telephone; h.instagram = priv[0].instagram; h.signes_negatifs = priv[0].signes_negatifs; }
    profil = h;
    const avatarUrl = urlPhoto(h?.photos && h.photos[0]);
    document.getElementById("head").innerHTML = `
      <div class="avatar">${avatarUrl ? `<img src="${avatarUrl}">` : esc((h?.prenom || "?")[0])}</div>
      <div><h1>${esc(h?.prenom || "Complète ton profil")}, ${h?.age || ""}</h1><div class="sub">${esc(h?.ville || "")} · ${esc(h?.instagram || "")}</div></div>
      <div class="note"><div class="n">${h?.note_moyenne ?? 5}</div><div class="s">★★★★★</div><div class="c">${h?.nb_avis ?? 0} avis</div></div>`;
    // formulaire d'édition pré-rempli
    document.getElementById("e-prenom").value = h?.prenom || "";
    document.getElementById("e-age").value = h?.age || "";
    document.getElementById("e-ville").value = h?.ville || "";
    document.getElementById("e-tel").value = h?.telephone || "";
    document.getElementById("e-insta").value = h?.instagram || "";
    afficherPhotos();
  }

  function afficherPhotos() {
    const photos = profil?.photos || [];
    const zone = document.getElementById("photos");
    const compteur = document.getElementById("compteur-photos");
    if (compteur) {
      const nb = photos.length;
      compteur.textContent = nb < 4 ? `(${nb}/7) : minimum 4 requis` : `(${nb}/7)`;
      compteur.style.color = nb < 4 ? "#C0392B" : "var(--gris)";
    }
    let html = photos.map((p, i) => `
      <div class="p" style="background-image:url('${urlPhoto(p)}')">
        <span class="del" onclick="supprimerPhoto(${i})">✕</span>
      </div>`).join("");
    // bouton ajouter (max 7 photos, comme le cahier des charges)
    if (photos.length < 7) html += `<div class="p add" onclick="ajouterPhotos()">＋</div>`;
    zone.innerHTML = html;
  }

  async function ajouterPhotos() {
    const nbActuel = (profil?.photos || []).length;
    if (nbActuel >= 7) { toast("Maximum 7 photos."); return; }
    const input = document.createElement("input");
    input.type = "file"; input.accept = "image/*"; input.multiple = true;
    input.onchange = async () => {
      let photos = [...(profil.photos || [])];
      for (const f of input.files) {
        if (photos.length >= 7) break;
        let fichier = f;
        try { fichier = await redimensionnerImage(f); } catch (e) { toast("Image invalide.", "erreur"); continue; }
        const path = `${user.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g, "")}`;
        const { error } = await sb.storage.from("photos").upload(path, fichier);
        if (error) { toast("Erreur : " + error.message, "erreur"); continue; }
        photos.push(`${SB_URL}/storage/v1/object/public/photos/${path}`);
      }
      await db.from("hotesses").update({ photos }).eq("id", user.id);
      profil.photos = photos;
      afficherPhotos();
    };
    input.click();
  }

  async function supprimerPhoto(i) {
    const photos = [...(profil.photos || [])];
    photos.splice(i, 1);
    await db.from("hotesses").update({ photos }).eq("id", user.id);
    profil.photos = photos;
    afficherPhotos();
  }

  function ouvrirEdit() {
    const f = document.getElementById("form-edit");
    f.classList.toggle("visible");
  }

  async function sauverProfil() {
    const maj = {
      prenom: document.getElementById("e-prenom").value,
      age: parseInt(document.getElementById("e-age").value) || null,
      ville: document.getElementById("e-ville").value,
      telephone: document.getElementById("e-tel").value || null,
      instagram: document.getElementById("e-insta").value || null,
    };
    if (!maj.prenom) { toast("Le prénom est obligatoire."); return; }
    if (!maj.age || maj.age < 18) { toast("Âge invalide (18 ans minimum)."); return; }
    const { error } = await db.from("hotesses").update(maj).eq("id", user.id);
    if (error) { toast(error.message, "erreur"); return; }
    document.getElementById("form-edit").classList.remove("visible");
    chargerProfil();
  }

  async function chargerMesMissions() {
    const { data } = await db.from("candidatures")
      .select("statut, created_at, missions(date, heure_debut, heure_fin, adresse, note, etablissements(id, nom))")
      .eq("hotesse_id", user.id).order("created_at", { ascending: false });
    const statuts = { en_attente: "🕓 En attente", acceptee: "✅ Acceptée", confirmee: "💚 Confirmée", refusee: "❌ Refusée" };
    document.getElementById("mes-missions").innerHTML = (data && data.length)
      ? data.map(c => {
          const m = c.missions;
          return `<div class="avis"><div class="t"><span class="e">${esc(m?.etablissements?.nom || "")}</span><span>${statuts[c.statut] || c.statut}</span></div><div class="txt">${formatDate(m?.date)} · ${formatHeure(m?.heure_debut)}–${formatHeure(m?.heure_fin)} · ${esc(m?.adresse || "")}</div>${m?.note ? `<div class="txt" style="white-space:pre-line">📝 ${esc(m.note)}</div>` : ""}<button class="btn btn-sm" style="background:#FBE4E1;color:var(--danger);margin-top:8px" onclick="ouvrirSignalement('etablissement', '${m?.etablissements?.id}')">🚩 Signaler</button></div>`;
        }).join("")
      : '<div style="color:var(--gris);font-size:13px">Aucune mission pour le moment.</div>';
  }

  async function chargerAvis() {
    const { data } = await db.from("avis")
      .select("note, commentaire, etablissements(nom)")
      .eq("hotesse_id", user.id).order("created_at", { ascending: false });
    document.getElementById("avis").innerHTML = (data && data.length)
      ? data.map(a => `<div class="avis"><div class="t"><span class="e">${esc(a.etablissements?.nom || "Établissement")}</span>
          <span class="st">${"★".repeat(a.note)}</span></div><div class="txt">${esc(a.commentaire || "")}</div></div>`).join("")
      : '<div style="color:var(--gris);font-size:13px">Aucun avis pour le moment.</div>';
  }

  async function chargerQR() {
    const zone = document.getElementById("qr");
    const { data } = await db.from("candidatures")
      .select("id, statut, confirme_a, annulation, qr_code, missions(date, heure_debut, heure_fin, adresse, note, etablissements(nom))")
      .eq("hotesse_id", user.id)
      .in("statut", ["acceptee", "confirmee"])
      .eq("annulation", false);
    const maintenant = new Date();
    const valides = (data || []).filter(c => {
      const m = c.missions;
      if (!m) return false;
      const fin = new Date(m.date + "T" + (m.heure_fin || "23:59:00"));
      return fin > maintenant;
    }).sort((a, b) =>
      new Date(a.missions.date + "T" + (a.missions.heure_debut || "00:00")) -
      new Date(b.missions.date + "T" + (b.missions.heure_debut || "00:00")));
    const c = valides[0];
    if (!c) { zone.innerHTML = "Aucune mission à venir. Ton QR code apparaîtra ici une fois acceptée ✨"; return; }
    const m = c.missions;
    const limite = c.confirme_a ? new Date(c.confirme_a) : null;

    let corps = "";
    if (c.statut === "acceptee") {
      const resteMin = limite ? Math.floor((limite - maintenant) / 60000) : null;
      const txtLimite = limite
        ? limite.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " à " + formatHeure(limite.toTimeString().slice(0, 5))
        : ":";
      const txtReste = resteMin === null ? "" :
        resteMin <= 0 ? '<div class="sous" style="color:#E57373">Délai dépassé</div>' :
        `<div class="sous" style="color:${resteMin < 60 ? "#E57373" : "var(--champagne)"}">Plus que ${Math.floor(resteMin/60)} h ${String(resteMin%60).padStart(2,"0")} pour confirmer</div>`;
      corps = `
        <div class="sous">${formatDate(m.date)} · ${formatHeure(m.heure_debut)}–${formatHeure(m.heure_fin)}</div>
        <p style="margin:10px 0;font-size:14px">Confirme avant <b>${txtLimite}</b> sinon ta place sera libérée.</p>
        ${txtReste}
        <button class="btn btn-primaire btn-block" onclick="confirmerMission('${c.id}')" style="margin-top:14px">Confirmer ma venue ✅</button>
        <button class="btn btn-block" style="background:#FBE4E1;color:var(--danger);margin-top:8px" onclick="annulerMission('${c.id}')">Je ne peux plus venir</button>`;
    } else {
      corps = `
        <div class="sous">${formatDate(m.date)} · ${formatHeure(m.heure_debut)}–${formatHeure(m.heure_fin)}</div>
        <div id="qrcode" style="background:#fff;border-radius:10px;padding:8px;width:200px;height:200px;margin:12px auto"></div>
        <div class="info"><div>👤 <b>${esc(user.email)}</b></div><div>📍 ${esc(m.adresse || "")}</div></div>
        <button class="btn btn-block" style="background:#FBE4E1;color:var(--danger);margin-top:12px" onclick="annulerMission('${c.id}')">Je ne peux plus venir</button>`;
    }

    zone.innerHTML = `<h2>${esc(m.etablissements?.nom || "Mission")}</h2>${m.note ? `<div style="background:var(--ivoire);border-radius:10px;padding:12px;margin:10px 0;font-size:13.5px;white-space:pre-line">📝 <b>Infos de l'établissement</b><br>${esc(m.note)}</div>` : ""}${corps}`;

    if (c.statut === "confirmee" && c.qr_code) {
      setTimeout(() => { new QRCode(document.getElementById("qrcode"), { text: "https://damocles2002.github.io/DamUp/etablissement.html#scan=" + c.qr_code, width: 200, height: 200, colorDark: "#2A1120" }); }, 50);
    }
  }

  async function confirmerMission(id) {
    const { error } = await db.from("candidatures").update({ statut: "confirmee" }).eq("id", id);
    if (error) { toast(error.message, "erreur"); return; }
    chargerQR();
    chargerMesMissions();
  }

  async function annulerMission(id) {
    const { data: c } = await db.from("candidatures").select("statut").eq("id", id).single();
    const dejaConfirmee = c?.statut === "confirmee";
    const msg = dejaConfirmee
      ? "Annuler après avoir confirmé te donne un signe négatif. Continuer ?"
      : "Annuler ta candidature pour cette mission ?";
    if (!await demander(msg)) return;
    const { error } = await db.from("candidatures").update({ annulation: true }).eq("id", id);
    if (error) { toast(error.message, "erreur"); return; }
    chargerQR();
    chargerMesMissions();
  }

  document.getElementById("logout").addEventListener("click", async () => { await auth.signOut(); location.href = "index.html"; });
  function chargerPartenaire() {
    try {
      db.from("settings").select("value").eq("key", "partenaire_lien").single().then(({ data }) => {
        const lien = (data && data.value || "").trim();
        const zone = document.getElementById("partenaire-suivi");
        if (!zone) return;
        if (!lien) { zone.innerHTML = ""; return; }
        zone.innerHTML = `<a href="${esc(lien)}" target="_blank" rel="noopener" style="color:var(--aubergine);font-weight:600">📸 Suivre notre partenaire</a>`;
      });
    } catch (e) {}
  }
  chargerPartenaire();
  chargerDicts().then(() => initSelecteurLangue("sel-langue"));
  init();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
