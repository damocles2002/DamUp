<!DOCTYPE html>
<html lang="fr" data-i18n-title="hotesse.titre">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DamUp</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A1120">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DamUp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #140A11; display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 430px; background: var(--ivoire-2); min-height: 100vh; position: relative;
         box-shadow: 0 0 60px rgba(0,0,0,.5); display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .crown { width: 26px; }
  .brand .nom { font-family: var(--font-titre); font-size: 22px; font-weight: 700; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(140deg, var(--champagne), var(--aubergine-3));
            display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; }
  .salut { padding: 4px 18px 14px; }
  .salut h1 { font-size: 24px; }
  .salut p { color: var(--gris); font-size: 14px; }
  .filtres { display: flex; gap: 8px; padding: 0 18px 14px; overflow-x: auto; }
  .chip { padding: 7px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; background: #fff;
          border: 1.5px solid var(--champagne-2); color: var(--aubergine); font-weight: 500; cursor: pointer;
          box-shadow: 0 1px 4px rgba(42,17,32,.08); }
  .chip.on { background: var(--aubergine); color: var(--ivoire); border-color: var(--aubergine); }
  .liste { flex: 1; padding: 0 18px 140px; display: flex; flex-direction: column; gap: 14px; }
  .mission { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: 0 6px 20px rgba(42,17,32,.08); cursor: pointer; }
  .mission .corps { padding: 14px 16px 16px; }
  .mission .entete { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .mission .icone-type { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(140deg,#4E223F,#2A1120);
                         display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .mission .titres { flex: 1; min-width: 0; }
  .mission .entete h3 { font-size: 17px; line-height: 1.3; margin: 0 0 2px; word-break: break-word; }
  .mission .entete .lieu { color: var(--gris); font-size: 12.5px; margin: 0; }
  .mission .entete .nb { flex-shrink: 0; }
  .mission .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 13px; }
  .mission .offres { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .mission .offres span { background: var(--champagne); color: var(--aubergine); padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--champagne-2); }
  .vide { text-align: center; color: var(--gris); padding: 60px 20px; font-size: 15px; }
  .bottomnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px;
               background: #fff; border-top: 1px solid #EEE4D2; display: flex; justify-content: space-around; padding: 10px 0 calc(14px + env(safe-area-inset-bottom)); }
  .bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--gris); text-decoration: none; }
  .bottomnav a.on { color: var(--aubergine); font-weight: 600; }
  .bottomnav .ico { font-size: 20px; }
  .spin { text-align: center; padding: 60px; color: var(--gris); }
  .overlay { position: fixed; inset: 0; background: rgba(42,17,32,.62); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
  .overlay.on { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 430px; max-height: 90vh; overflow-y: auto; border-radius: 22px 22px 0 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #F1E9DA; position: sticky; top: 0; background: #fff; }
  .sheet-head h3 { font-size: 17px; margin: 0; }
  .sheet-close { border: none; background: #F4E8D6; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer; color: var(--aubergine); }
  .galerie { display: flex; gap: 10px; overflow-x: auto; padding: 16px 18px 0; scroll-snap-type: x mandatory; }
  .galerie img { width: 84vw; max-width: 370px; height: 230px; object-fit: cover; border-radius: 14px; flex-shrink: 0; scroll-snap-align: center; }
  .sheet .details { padding: 16px 18px 8px; }
  .topbar, .salut, .filtres { flex-shrink: 0; }
  .filtres { scrollbar-width: none; }
  .filtres::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><img class="crown" src="assets/logo-couronne.png" alt=""><span class="nom">DamUp</span></div>
    <div style="display:flex;align-items:center;gap:12px">
      <div id="sel-langue"></div>
      <button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="ouvrirMessages()">💬</button>
      <div id="cloche"></div>
      <div class="avatar" id="avatar" title="Mon profil">?</div>
    </div>
  </div>

  <div class="salut">
    <h1 id="salut">Bonjour 👋</h1>
    <p id="sous-salut">Chargement…</p>
  </div>

  <div id="invitations-copine"></div>

  <div id="partenaire-badge" style="display:none;margin:0 18px 8px;font-size:12.5px;color:var(--gris);text-align:center"></div>

  <div id="carte-qr-jour" style="display:none;margin:0 18px 6px"></div>

  <div class="filtres">
    <span class="chip on" data-type="" data-i18n="hotesse.filtre_toutes">Toutes</span>
    <span class="chip" data-type="bar" data-i18n="commun.type_bar">Bar</span>
    <span class="chip" data-type="restaurant" data-i18n="commun.type_restaurant">Restaurant</span>
    <span class="chip" data-type="club" data-i18n="commun.type_club">Club</span>
    <span class="chip" data-type="lounge" data-i18n="commun.type_lounge">Lounge</span>
  </div>

  <div class="liste" id="liste"><div class="spin" data-i18n="hotesse.chargement_missions">Chargement des missions…</div></div>

  <nav class="bottomnav">
    <a class="on" href="#"><span class="ico">🏠</span><span data-i18n="nav.missions">Missions</span></a>
    <a href="hotesse-profil.html"><span class="ico">👤</span><span data-i18n="nav.profil">Profil</span></a>
    <a href="#" id="logout"><span class="ico">🚪</span><span data-i18n="nav.quitter">Quitter</span></a>
  </nav>
</div>

<script src="js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/ui.js"></script>
<script src="js/install.js"></script>
<script src="js/notifications.js"></script>
<script src="js/copine.js"></script>
<script src="js/messages.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const liste = document.getElementById("liste");
  let user = null, profil = null, filtre = "";

  // --- articles offerts : libellés lisibles ---
  const ICONES = { boisson:"🍸", entree:"🥗", plat:"🍴", dessert:"🍰", chicha:"💨" };
  const TYPES = { bar:"🍸", restaurant:"🍴", club:"🥂", lounge:"🛋️" };

  // --- garde d'accès : il faut être connecté ---
  async function init() {
    const { data } = await auth.getUser();
    if (!data.user) { location.href = "login.html"; return; }
    user = data.user;
    const { data: p } = await db.from("hotesses").select("id, prenom, age, ville, photos, note_moyenne, nb_avis, verifie, created_at").eq("id", user.id).single();
    profil = p;
    const { data: pr } = await db.from("profiles").select("langue").eq("id", user.id).single();
    if (pr?.langue) appliquerLangueCompte(pr.langue);
    document.getElementById("avatar").textContent = (p?.prenom || user.email || "?")[0].toUpperCase();
    document.getElementById("salut").textContent = t("hotesse.bonjour", { prenom: p?.prenom || "" });
    chargerMissions();
    chargerQRJour();
    initCloche("cloche", user.id);
    chargerPartenaire();
    chargerInvitationsCopine("invitations-copine");
    if (location.hash === "#invitations") {
      setTimeout(() => document.getElementById("invitations-copine")?.scrollIntoView({ behavior: "smooth" }), 400);
    }
  }

  function chargerPartenaire() {
    try {
      db.from("settings").select("key, value").in("key", ["partenaire_nom", "partenaire_lien"]).then(({ data }) => {
        const s = Object.fromEntries((data || []).map(r => [r.key, r.value]));
        const lien = (s.partenaire_lien || "").trim();
        const zone = document.getElementById("partenaire-badge");
        if (!zone || !lien) return;
        const nom = (s.partenaire_nom || "Le Barreau des Barmans").trim();
        zone.style.display = "block";
        zone.innerHTML = t("partenaire.avec", { nom: '<a href="' + lien + '" target="_blank" rel="noopener" style="color:var(--aubergine);font-weight:700">' + esc(nom) + '</a>' });
      });
    } catch (e) {}
  }

  // --- filtrer par type d'établissement ---
  document.querySelectorAll(".filtres .chip").forEach(c => {
    c.addEventListener("click", () => {
      document.querySelectorAll(".filtres .chip").forEach(x => x.classList.remove("on"));
      c.classList.add("on");
      filtre = c.dataset.type;
      chargerMissions();
    });
  });

  // --- charger les missions ouvertes (join établissement pour le nom) ---
  async function chargerMissions() {
    liste.innerHTML = '<div class="spin">Chargement…</div>';
    const { data: toutes, error } = await db.from("missions")
      .select("*, etablissements(nom, ville, type, photos)")
      .eq("statut", "ouverte")
      .gte("date", new Date().toISOString().slice(0,10))
      .order("date", { ascending: true });
    if (error) { liste.innerHTML = '<div class="vide">Erreur de chargement.</div>'; return; }
    // filtre côté client (fiable, contrairement au filtre serveur sur relation imbriquée)
    const missions = filtre ? (toutes || []).filter(m => m.etablissements?.type === filtre) : (toutes || []);
    document.getElementById("sous-salut").textContent = missions.length + " mission(s) disponible(s).";

    if (!missions.length) { liste.innerHTML = '<div class="vide">Aucune mission pour le moment.<br>Reviens bientôt ✨</div>'; return; }

    liste.innerHTML = missions.map(m => {
      const e = m.etablissements;
      const offres = (m.articles_offerts || []).map(a => `<span>${ICONES[a]||"•"} ${LIBELLES_ARTICLES[a]||a}</span>`).join("");
      const couverture = `${TYPES[e?.type]||"📍"}`;
      return `
      <div class="mission" onclick="ouvrirMission('${m.id}')">
        <div class="corps">
          <div class="entete">
            <div class="icone-type">${couverture}</div>
            <div class="titres">
              <h3>${esc(e?.nom || "Établissement")}</h3>
              <div class="lieu">📍 ${esc(m.adresse || e?.ville || "")}${m.note ? " · 📝" : ""}</div>
            </div>
            <span class="badge badge-champagne nb">${m.places_restantes ?? m.nb_hotesses} places</span>
          </div>
          <div class="meta">
            <span class="badge badge-aubergine">📅 ${formaterDate(m.date)}</span>
            <span class="badge badge-aubergine">🕗 ${formatHeure(m.heure_debut)} – ${formatHeure(m.heure_fin)}</span>
          </div>
          <div class="offres">${offres}</div>
          <button class="btn btn-primaire btn-block btn-sm" onclick="event.stopPropagation(); ouvrirMission('${m.id}')">Voir les photos 📸</button>
        </div>
      </div>`;
    }).join("");
  }

  function formaterDate(d) {
    // "2026-11-08" → "sam. 8 nov."
    const j = new Date(d + "T00:00:00");
    return j.toLocaleDateString("fr-FR", { weekday:"short", day:"numeric", month:"short" });
  }

  // --- carte "Mon QR code" du jour (mission confirmée aujourd'hui / demain après 18h) ---
  async function chargerQRJour() {
    const zone = document.getElementById("carte-qr-jour");
    if (!zone) return;
    const aujourdhui = new Date().toISOString().slice(0, 10);
    const demain = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
    const heure = new Date().getHours();
    const { data: cands } = await db.from("candidatures")
      .select("id, qr_code, missions(date, heure_debut, heure_fin, etablissements(nom))")
      .eq("hotesse_id", user.id)
      .eq("statut", "confirmee")
      .eq("annulation", false);
    const c = (cands || []).find(c => {
      const d = c.missions?.date;
      if (d === aujourdhui) return true;
      return d === demain && heure >= 18;
    });
    if (!c) { zone.style.display = "none"; return; }
    const m = c.missions, e = m?.etablissements;
    const estDemain = m?.date === demain;
    window._qr_code_du_jour = c.qr_code;
    window._candidature_du_jour = c.id;
    zone.style.display = "block";
    zone.innerHTML = `
      <div style="background:linear-gradient(135deg, var(--aubergine), #4A2540);color:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(42,17,32,.18)">
        <div style="font-size:11.5px;opacity:.85;text-transform:uppercase;letter-spacing:1px">${esc(t(estDemain ? "qr_jour.carte_demain" : "qr_jour.carte"))}</div>
        <div style="font-size:17px;font-weight:700;margin-top:8px">📍 ${esc(e?.nom || "")}</div>
        <div style="font-size:13px;margin-top:3px;opacity:.9">🕗 ${formatHeure(m?.heure_debut)} – ${formatHeure(m?.heure_fin)}</div>
        <button class="btn btn-champagne btn-block" style="margin-top:12px;font-weight:700" onclick="afficherMonQR()">${esc(t("qr_jour.bouton"))}</button>
        <button class="btn" style="margin-top:8px;background:rgba(255,255,255,.15);color:#fff;font-weight:600;width:100%" onclick="annoncerRetard()">${esc(t("qr_jour.retard"))}</button>
      </div>`;
  }

  function afficherMonQR() {
    const code = window._qr_code_du_jour;
    if (!code) return;
    const ov = document.createElement("div");
    ov.id = "overlay-qr";
    ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center";
    ov.innerHTML = `
      <div style="font-size:20px;font-weight:700">${esc(t("qr_jour.bouton"))}</div>
      <div style="font-size:13px;opacity:.85;margin-top:8px">${esc(t("qr_jour.luminosite"))} ☀️</div>
      <div id="qrcode-jour" style="background:#fff;border-radius:16px;padding:14px;margin:22px 0"></div>
      <button class="btn" style="background:rgba(255,255,255,.2);color:#fff;font-weight:600" onclick="document.getElementById('overlay-qr').remove()">✕ ${esc(t("commun.fermer"))}</button>`;
    document.body.appendChild(ov);
    setTimeout(() => {
      new QRCode(document.getElementById("qrcode-jour"), {
        text: SITE_URL + "/etablissement.html#scan=" + code,
        width: 260, height: 260, colorDark: "#2A1120"
      });
    }, 50);
  }

  // --- annoncer un retard (choix 15 min / 30 min / 1 h / autre) ---
  function annoncerRetard() {
    if (!window._candidature_du_jour) return;
    const ov = document.createElement("div");
    ov.id = "overlay-retard";
    ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:flex-end;justify-content:center";
    ov.innerHTML = `
      <div style="background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:430px;padding:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="font-family:var(--font-titre);font-size:18px">${esc(t("qr_jour.retard"))}</h3><button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="document.getElementById('overlay-retard').remove()">✕</button></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn" style="background:var(--champagne);color:var(--aubergine);font-weight:600" onclick="choisirRetard(15)">15 min</button>
          <button class="btn" style="background:var(--champagne);color:var(--aubergine);font-weight:600" onclick="choisirRetard(30)">30 min</button>
          <button class="btn" style="background:var(--champagne);color:var(--aubergine);font-weight:600" onclick="choisirRetard(60)">1 h</button>
          <button class="btn" style="background:var(--ivoire);color:var(--aubergine)" onclick="choisirRetardAutre()">${esc(t("qr_jour.retard_autre"))}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
  }

  function choisirRetard(min) {
    document.getElementById("overlay-retard")?.remove();
    envoyerRetard(min);
  }

  function choisirRetardAutre() {
    const min = parseInt(prompt("Retard en minutes (5 à 180) :") || "", 10);
    if (isNaN(min)) return;
    document.getElementById("overlay-retard")?.remove();
    envoyerRetard(min);
  }

  async function envoyerRetard(min) {
    const candId = window._candidature_du_jour;
    if (!candId) return;
    const { error } = await db.rpc("annoncer_retard", { p_candidature: candId, p_minutes: min });
    if (error) { toast(error.message); return; }
    toast("Retard annoncé ✅ L'établissement est prévenu.");
    chargerQRJour();
  }

  // --- postuler : crée une candidature "en attente" ---
  async function postuler(missionId) {
    const { data: h } = await db.from("hotesses").select("photos").eq("id", user.id).single();
    if ((h?.photos || []).length < 4) { toast("Ajoute au moins 4 photos sur ton profil pour postuler (minimum requis)."); return; }
    const { data: created, error } = await db.from("candidatures").insert({
      mission_id: missionId, hotesse_id: user.id, statut: "en_attente"
    }).select().single();
    if (error) {
      if (error.code === "23505") { toast("Tu as déjà postulé à cette mission."); return; }
      toast("Impossible de postuler : " + (error.message || "erreur inconnue"));
      return;
    }
    toast("Candidature envoyée ✅ Tu seras notifiée en cas de sélection.");
    if (created?.id) ouvrirProposerCopine(created.id);
  }

  // --- ouvrir le détail d'une mission (photos + infos) ---
  async function ouvrirMission(id) {
    const { data: m } = await db.from("missions").select("*, etablissements(nom, ville, type, photos)").eq("id", id).single();
    if (!m) return;
    const e = m.etablissements;
    const photos = e?.photos || [];
    const medias = (m.medias || []).filter(x => !photos.includes(x));
    const tous = [...photos, ...medias].map(p => urlPhoto(p)).filter(Boolean);
    const offres = (m.articles_offerts || []).map(a => `<span>${ICONES[a]||"•"} ${LIBELLES_ARTICLES[a]||a}</span>`).join("");
    const sheet = document.getElementById("sheet-mission");
    sheet.innerHTML = `
      <div class="sheet-head">
        <h3>${esc(e?.nom || "Établissement")}</h3>
        <button class="sheet-close" onclick="fermerMission()">✕</button>
      </div>
      <div class="galerie">
        ${tous.length ? tous.map(p => `<img src="${p}">`).join("") : '<div style="padding:30px 18px;color:var(--gris)">Aucune photo pour le moment.</div>'}
      </div>
      <div class="details">
        <div class="meta">
          <span class="badge badge-aubergine">📅 ${formaterDate(m.date)}</span>
          <span class="badge badge-aubergine">🕗 ${formatHeure(m.heure_debut)} – ${formatHeure(m.heure_fin)}</span>
          <span class="badge badge-champagne">👥 ${m.places_restantes ?? m.nb_hotesses} places restantes</span>
        </div>
        <div class="lieu" style="margin:10px 0">📍 ${esc(m.adresse || e?.ville || "")}</div>
        <div class="offres">${offres}</div>
        ${m.note ? `<div style="background:var(--ivoire);border-radius:10px;padding:12px;margin-top:12px;font-size:13.5px;white-space:pre-line">📝 <b>Infos de l'établissement</b><br>${esc(m.note)}</div>` : ""}
        <button class="btn btn-primaire btn-block" onclick="postulerDepuisModal('${m.id}')" style="margin-top:14px">Postuler</button>
        <button class="btn btn-block" style="background:#FBE4E1;color:var(--danger);margin-top:8px" onclick="ouvrirSignalement('mission', '${m.id}')">🚩 Signaler</button>
      </div>`;
    document.getElementById("modal-mission").classList.add("on");
  }

  function fermerMission() { document.getElementById("modal-mission").classList.remove("on"); }

  async function postulerDepuisModal(id) { fermerMission(); await postuler(id); }

  document.getElementById("avatar").addEventListener("click", () => location.href = "hotesse-profil.html");
  document.getElementById("logout").addEventListener("click", async () => { await auth.signOut(); location.href = "index.html"; });

  chargerDicts().then(() => initSelecteurLangue("sel-langue"));
  init();
</script>
<div class="overlay" id="modal-mission">
  <div class="sheet" id="sheet-mission"></div>
</div>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
