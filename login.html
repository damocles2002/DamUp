<!DOCTYPE html>
<html lang="fr" data-i18n-title="login.titre">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DamUp</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A1120">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DamUp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: radial-gradient(120% 120% at 50% 0%, #4E223F 0%, #2A1120 55%, #1E0C17 100%);
         color: var(--ivoire); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .carte-auth { width: 100%; max-width: 440px; background: var(--blanc); color: var(--encre);
                border-radius: 22px; padding: 30px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .logo { text-align: center; margin-bottom: 6px; }
  .logo img { width: 56px; margin: 0 auto; }
  .logo h1 { font-family: var(--font-titre); font-size: 28px; margin-top: 4px; }
  .sous { text-align: center; color: var(--gris); font-size: 14px; margin-bottom: 20px; }

  .choix-role { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .role { padding: 13px 10px; border-radius: 13px; border: 1.5px solid #EADFCC; text-align: center;
          cursor: pointer; font-size: 14px; font-weight: 500; transition: all .15s ease; }
  .role.on { background: var(--aubergine); color: var(--ivoire); border-color: var(--aubergine); }

  .champ { margin-bottom: 12px; }
  .ligne { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .msg { display: none; padding: 11px 14px; border-radius: 11px; font-size: 13.5px; margin-bottom: 12px; }
  .msg.err { display: block; background: #FBE4E1; color: var(--danger); }
  .msg.ok { display: block; background: #E3F2E0; color: var(--ok); }

  #champs-role { display: none; }
  #champs-role.visible { display: block; }
  .bascule { text-align: center; margin-top: 16px; font-size: 14px; color: var(--gris); }
  .bascule a { color: var(--aubergine); font-weight: 600; cursor: pointer; }
  .note { text-align: center; font-size: 12px; color: var(--gris); margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>
<div id="sel-langue" style="text-align:right;padding:14px 16px 0;color:var(--ivoire)"></div>
<div class="carte-auth">
  <div class="logo">
    <img src="assets/logo-couronne.png" alt="DamUp">
    <h1>DamUp</h1>
  </div>
  <div class="sous" id="sous-titre"></div>

  <div class="choix-role" id="choix-role">
    <div class="role on" data-role="hotesse" data-i18n="login.hotesse">✨ Hôtesse</div>
    <div class="role" data-role="etablissement" data-i18n="login.etablissement">🏠 Établissement</div>
  </div>

  <div class="msg" id="msg"></div>

  <!-- champs communs -->
  <div class="champ">
    <label class="label" data-i18n="login.email">E-mail</label>
    <input class="field" type="email" id="email" placeholder="vous@exemple.fr">
  </div>
  <div class="champ">
    <label class="label" data-i18n="login.mdp">Mot de passe</label>
    <input class="field" type="password" id="mdp" data-i18n-placeholder="login.mdp_placeholder" placeholder="6 caractères minimum">
  </div>
  <div style="text-align:right;margin:-6px 0 10px"><a id="lien-oubli" style="color:var(--aubergine);font-size:12.5px;font-weight:600;cursor:pointer" data-i18n="login.oubli">Mot de passe oublié ?</a></div>

  <!-- champs selon le rôle (renseignements obligatoires du cahier des charges) -->
  <div id="champs-role" class="visible"></div>

  <button class="btn btn-primaire btn-block" id="btn-action">Créer mon compte</button>

  <div class="bascule">
    <span id="txt-bascule"></span> <a id="lien-bascule"></a>
  </div>

  <div id="bloc-cgu" style="margin-top:16px;display:none">
    <label style="display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--gris);line-height:1.45;cursor:pointer">
      <input type="checkbox" id="accept-cgu" style="margin-top:2px;accent-color:var(--aubergine)">
      <span id="cgu-texte"></span>
    </label>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/ui.js"></script>
<script src="js/motdepasse.js"></script>
<script>
  let mode = "connexion";
  let role = "hotesse";
  let codeInvitation = null;
  let verifierMdp = null;
  const msg = document.getElementById("msg");
  const champsRole = document.getElementById("champs-role");

  function afficherMsg(txt, type) { msg.textContent = txt; msg.className = "msg " + type; }

  function appareilId() {
    let id = localStorage.getItem("damup_appareil");
    if (!id) { id = (window.crypto?.randomUUID?.() || ("dev-" + Date.now() + "-" + Math.random().toString(36).slice(2))); localStorage.setItem("damup_appareil", id); }
    return id;
  }

  function afficherIndicateurMdp(visible) {
    const z = document.getElementById("zone-mdp-mdp");
    const o = document.getElementById("oeil-mdp-mdp");
    if (z) z.style.display = visible ? "" : "none";
    if (o) o.style.display = visible ? "" : "none";
  }
  document.getElementById("mdp").addEventListener("input", () => {
    if (mode === "inscription" && verifierMdp) btn.disabled = !verifierMdp().ok;
  });
  document.getElementById("email").addEventListener("input", () => {
    if (mode === "inscription" && verifierMdp) btn.disabled = !verifierMdp().ok;
  });

  // --- choix du rôle ---
  document.querySelectorAll("#choix-role .role").forEach(el => {
    el.addEventListener("click", () => {
      document.querySelectorAll("#choix-role .role").forEach(r => r.classList.remove("on"));
      el.classList.add("on");
      role = el.dataset.role;
      adapterChamps();
    });
  });

  // --- les champs varient selon le rôle ---
  function adapterChamps() {
    const zone = champsRole;
    if (role === "hotesse") {
      zone.innerHTML = `
        <div class="champ"><label class="label">${t("login.prenom")}</label><input class="field" id="prenom" placeholder="Léa"></div>
        <div class="ligne">
          <div class="champ"><label class="label">${t("login.age")}</label><input class="field" type="number" id="age" min="18" max="99" placeholder="24"></div>
          <div class="champ"><label class="label">${t("login.ville")}</label><input class="field" id="ville" placeholder="Paris"></div>
        </div>
        <div class="ligne">
          <div class="champ"><label class="label">${t("login.telephone")}</label><input class="field" id="tel" placeholder="06 12 34 56 78"></div>
          <div class="champ"><label class="label">${t("login.instagram_obligatoire")}</label><input class="field" id="insta" placeholder="@lea.damup"></div>
        </div>`;
    } else {
      zone.innerHTML = `
        <div class="champ"><label class="label">${t("login.nom_etab")}</label><input class="field" id="etab-nom" placeholder="Le Baroque"></div>
        <div class="ligne">
          <div class="champ"><label class="label">${t("login.type")}</label>
            <select class="field" id="etab-type"><option>bar</option><option>restaurant</option><option>club</option><option>lounge</option></select></div>
          <div class="champ"><label class="label">${t("login.ville")}</label><input class="field" id="etab-ville" placeholder="Paris"></div>
        </div>
        <div class="champ"><label class="label">${t("login.adresse")}</label><input class="field" id="etab-adresse" placeholder="12 rue Oberkampf"></div>
        <div class="champ"><label class="label">${t("login.siret")}</label><input class="field" id="etab-siret" placeholder="000 000 000 00000"></div>`;
    }
  }

  // --- bascule inscription / connexion ---
  const btn = document.getElementById("btn-action");
  const lienBascule = document.getElementById("lien-bascule");
  const txtBascule = document.getElementById("txt-bascule");
  const sousTitre = document.getElementById("sous-titre");
  function setMode(m) {
    mode = m;
    const choixRole = document.getElementById("choix-role");
    if (m === "inscription") {
      btn.textContent = t("login.creer");
      txtBascule.textContent = t("login.deja_compte");
      lienBascule.textContent = t("login.se_connecter");
      sousTitre.textContent = t("login.sous_inscription");
      choixRole.style.display = "grid";
      champsRole.classList.add("visible");
      document.getElementById("bloc-cgu").style.display = "block";
      afficherIndicateurMdp(true);
      if (verifierMdp) btn.disabled = !verifierMdp().ok;
    } else {
      btn.textContent = t("login.se_connecter");
      txtBascule.textContent = t("login.pas_encore");
      lienBascule.textContent = t("login.creer_compte");
      sousTitre.textContent = t("login.sous_connexion");
      choixRole.style.display = "none";
      champsRole.classList.remove("visible");
      document.getElementById("bloc-cgu").style.display = "none";
      afficherIndicateurMdp(false);
      btn.disabled = false;
    }
  }
  lienBascule.addEventListener("click", () => setMode(mode === "inscription" ? "connexion" : "inscription"));

  function messageLisible(m) {
    if (m.includes("Invalid login credentials")) return t("login.msg_email_incorrect");
    if (m.includes("User already registered")) return t("login.msg_deja_compte");
    if (m.includes("Email not confirmed")) return t("login.msg_confirme");
    return m || t("login.msg_erreur");
  }

  function rendreCGU() {
    document.getElementById("cgu-texte").innerHTML = t("login.cgu_texte", {
      cgu: '<a href="cgu.html" target="_blank" style="color:var(--aubergine);font-weight:600">' + t("legal.cgu") + '</a>',
      conf: '<a href="confidentialite.html" target="_blank" style="color:var(--aubergine);font-weight:600">' + t("legal.conf") + '</a>'
    });
  }

  // --- mot de passe oublié ---
  document.getElementById("lien-oubli").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) { afficherMsg(t("login.msg_saisis_email"), "err"); return; }
    await auth.resetPasswordForEmail(email, { redirectTo: SITE_URL + "/reinitialiser.html" });
    afficherMsg(t("login.msg_email_envoye"), "ok");
  });

  btn.addEventListener("click", async () => {
    afficherMsg("");
    const email = document.getElementById("email").value;
    const mdp = document.getElementById("mdp").value;
    if (!email || !mdp) return afficherMsg(t("login.msg_renseigne"), "err");

    // vérifications AVANT de désactiver le bouton
    if (mode === "inscription") {
      if (role === "hotesse") {
        const age = parseInt(document.getElementById("age").value);
        if (!document.getElementById("prenom").value) return afficherMsg(t("login.msg_prenom"), "err");
        if (!age || age < 18) return afficherMsg(t("login.msg_age"), "err");
        if (!document.getElementById("ville").value) return afficherMsg(t("login.msg_ville"), "err");
        if (!document.getElementById("insta").value) return afficherMsg(t("login.msg_insta"), "err");
      } else {
        if (!document.getElementById("etab-nom").value) return afficherMsg(t("login.msg_nom_etab"), "err");
        if (!document.getElementById("etab-siret").value) return afficherMsg(t("login.msg_siret"), "err");
      }
      if (!document.getElementById("accept-cgu").checked) return afficherMsg(t("login.msg_cgu"), "err");
    }

    btn.disabled = true; btn.textContent = t("login.un_instant");

    try {
      if (mode === "inscription") {
        // les champs partent dans user_metadata → le trigger SQL crée les entrées automatiquement
        const meta = role === "hotesse"
          ? { role, prenom: document.getElementById("prenom").value, age: parseInt(document.getElementById("age").value), ville: document.getElementById("ville").value, telephone: document.getElementById("tel").value || null, instagram: document.getElementById("insta").value || null, code_invitation: codeInvitation, cgu_acceptees_le: new Date().toISOString(), cgu_version: "2026-11-08" }
          : { role: "etablissement", nom: document.getElementById("etab-nom").value, type_etab: document.getElementById("etab-type").value, ville: document.getElementById("etab-ville").value || null, adresse: document.getElementById("etab-adresse").value || null, siret: document.getElementById("etab-siret").value, cgu_acceptees_le: new Date().toISOString(), cgu_version: "2026-11-08" };

        const { data, error } = await auth.signUp({ email, password: mdp, options: { data: meta } });
        if (error) throw error;
        afficherMsg(t("login.msg_cree"), "ok");
      } else {
        const { error } = await auth.signInWithPassword({ email, password: mdp });
        if (error) throw error;
        afficherMsg(t("login.msg_connecte"), "ok");
        const { data: u } = await auth.getUser();
        const { data: p } = await db.from("profiles").select("type, suspendu, langue").eq("id", u.user.id).single();
        if (p && p.suspendu) {
          await auth.signOut();
          afficherMsg(t("login.msg_suspendu"), "err");
          return;
        }
        if (p && p.langue) appliquerLangueCompte(p.langue);
        const type = p && p.type;
        if (type === "admin") {
          sb.functions.invoke("connexion", { body: { appareil: appareilId() } }).catch(() => {});
        }
        setTimeout(() => location.href = type === "etablissement" ? "etablissement.html" : (type === "admin" ? "admin.html" : "hotesse.html"), 600);
      }
    } catch (e) {
      afficherMsg(messageLisible(e.message || ""), "err");
    } finally {
      btn.disabled = false; setMode(mode);
    }
  });

  // --- rendu initial après chargement des dictionnaires ---
  chargerDicts().then(() => {
    initSelecteurLangue("sel-langue");
    rendreCGU();
    adapterChamps();
    appliquerLangueDOM();
    // indicateur de solidité du mot de passe (inscription)
    verifierMdp = brancherIndicateurMdp(document.getElementById("mdp"), () => ({
      email: document.getElementById("email").value,
      prenom: document.getElementById("prenom")?.value || "",
      nom: document.getElementById("etab-nom")?.value || "",
    }), null);
    setMode("connexion");

    // Ouverture directe depuis l'accueil : login.html?mode=inscription&role=etablissement|hotesse
    const params = new URLSearchParams(location.search);
    const pm = params.get("mode");
    const pr = params.get("role");
    const inv = params.get("invitation");
    if (inv) codeInvitation = inv;
    if (pr === "etablissement" || pr === "hotesse") {
      role = pr;
      document.querySelectorAll("#choix-role .role").forEach(r => r.classList.toggle("on", r.dataset.role === pr));
      adapterChamps();
    }
    if (pm === "inscription") setMode("inscription");
  });
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
