<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DamUp — Connexion / Inscription</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: radial-gradient(120% 120% at 50% 0%, #4E223F 0%, #2A1120 55%, #1E0C17 100%);
         color: var(--ivoire); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .carte-auth { width: 100%; max-width: 440px; background: var(--blanc); color: var(--encre);
                border-radius: 22px; padding: 30px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .logo { text-align: center; margin-bottom: 6px; }
  .logo img { width: 56px; margin: 0 auto; }
  .logo h1 { font-family: var(--font-titre); font-size: 28px; margin-top: 4px; }
  .sous { text-align: center; color: var(--gris); font-size: 14px; margin-bottom: 20px; }

  .choix-role { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .role { padding: 13px 10px; border-radius: 13px; border: 1.5px solid #EADFCC; text-align: center;
          cursor: pointer; font-size: 14px; font-weight: 500; transition: all .15s ease; }
  .role.on { background: var(--aubergine); color: var(--ivoire); border-color: var(--aubergine); }

  .champ { margin-bottom: 12px; }
  .ligne { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .msg { display: none; padding: 11px 14px; border-radius: 11px; font-size: 13.5px; margin-bottom: 12px; }
  .msg.err { display: block; background: #FBE4E1; color: var(--danger); }
  .msg.ok { display: block; background: #E3F2E0; color: var(--ok); }

  #champs-role { display: none; }
  #champs-role.visible { display: block; }
  .bascule { text-align: center; margin-top: 16px; font-size: 14px; color: var(--gris); }
  .bascule a { color: var(--aubergine); font-weight: 600; cursor: pointer; }
  .note { text-align: center; font-size: 12px; color: var(--gris); margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>
<div class="carte-auth">
  <div class="logo">
    <img src="assets/logo-couronne.png" alt="DamUp">
    <h1>DamUp</h1>
  </div>
  <div class="sous" id="sous-titre">Créez votre compte gratuitement</div>

  <div class="choix-role" id="choix-role">
    <div class="role on" data-role="hotesse">✨ Hôtesse</div>
    <div class="role" data-role="etablissement">🏠 Établissement</div>
  </div>

  <div class="msg" id="msg"></div>

  <!-- champs communs -->
  <div class="champ">
    <label class="label">E-mail</label>
    <input class="field" type="email" id="email" placeholder="vous@exemple.fr">
  </div>
  <div class="champ">
    <label class="label">Mot de passe</label>
    <input class="field" type="password" id="mdp" placeholder="6 caractères minimum">
  </div>

  <!-- champs selon le rôle (renseignements obligatoires du cahier des charges) -->
  <div id="champs-role" class="visible">
    <div class="champ"><label class="label">Prénom</label><input class="field" id="prenom" placeholder="Léa"></div>
    <div class="ligne">
      <div class="champ"><label class="label">Âge (18+)</label><input class="field" type="number" id="age" min="18" max="99" placeholder="24"></div>
      <div class="champ"><label class="label">Ville</label><input class="field" id="ville" placeholder="Paris"></div>
    </div>
    <div class="ligne">
      <div class="champ"><label class="label">Téléphone</label><input class="field" id="tel" placeholder="06 12 34 56 78"></div>
      <div class="champ"><label class="label">Instagram</label><input class="field" id="insta" placeholder="@lea.damup"></div>
    </div>
  </div>

  <button class="btn btn-primaire btn-block" id="btn-action">Créer mon compte</button>

  <div class="bascule">
    <span id="txt-bascule">Déjà un compte ?</span> <a id="lien-bascule">Se connecter</a>
  </div>

  <div class="note">En vous inscrivant, vous acceptez nos CGU et notre politique de confidentialité.<br>Réservé aux personnes majeures (18 ans et +).</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script>
  let mode = "inscription";
  let role = "hotesse";
  const msg = document.getElementById("msg");
  const champsRole = document.getElementById("champs-role");

  function afficherMsg(txt, type) { msg.textContent = txt; msg.className = "msg " + type; }

  // --- choix du rôle ---
  document.querySelectorAll("#choix-role .role").forEach(el => {
    el.addEventListener("click", () => {
      document.querySelectorAll("#choix-role .role").forEach(r => r.classList.remove("on"));
      el.classList.add("on");
      role = el.dataset.role;
      adapterChamps();
    });
  });

  // --- les champs varient selon le rôle ---
  function adapterChamps() {
    const zone = champsRole;
    if (role === "hotesse") {
      zone.innerHTML = `
        <div class="champ"><label class="label">Prénom</label><input class="field" id="prenom" placeholder="Léa"></div>
        <div class="ligne">
          <div class="champ"><label class="label">Âge (18+)</label><input class="field" type="number" id="age" min="18" max="99" placeholder="24"></div>
          <div class="champ"><label class="label">Ville</label><input class="field" id="ville" placeholder="Paris"></div>
        </div>
        <div class="ligne">
          <div class="champ"><label class="label">Téléphone</label><input class="field" id="tel" placeholder="06 12 34 56 78"></div>
          <div class="champ"><label class="label">Instagram (obligatoire)</label><input class="field" id="insta" placeholder="@lea.damup"></div>
        </div>`;
    } else {
      zone.innerHTML = `
        <div class="champ"><label class="label">Nom de l'établissement</label><input class="field" id="etab-nom" placeholder="Le Baroque"></div>
        <div class="ligne">
          <div class="champ"><label class="label">Type</label>
            <select class="field" id="etab-type"><option>bar</option><option>restaurant</option><option>club</option><option>lounge</option></select></div>
          <div class="champ"><label class="label">Ville</label><input class="field" id="etab-ville" placeholder="Paris"></div>
        </div>
        <div class="champ"><label class="label">Adresse</label><input class="field" id="etab-adresse" placeholder="12 rue Oberkampf"></div>
        <div class="champ"><label class="label">SIRET</label><input class="field" id="etab-siret" placeholder="000 000 000 00000"></div>`;
    }
  }

  // --- bascule inscription / connexion ---
  const btn = document.getElementById("btn-action");
  const lienBascule = document.getElementById("lien-bascule");
  const txtBascule = document.getElementById("txt-bascule");
  const sousTitre = document.getElementById("sous-titre");
  function setMode(m) {
    mode = m;
    if (m === "inscription") {
      btn.textContent = "Créer mon compte";
      txtBascule.textContent = "Déjà un compte ?";
      lienBascule.textContent = "Se connecter";
      sousTitre.textContent = "Créez votre compte gratuitement";
      champsRole.classList.add("visible");
    } else {
      btn.textContent = "Se connecter";
      txtBascule.textContent = "Pas encore de compte ?";
      lienBascule.textContent = "Créer un compte";
      sousTitre.textContent = "Bon retour sur DamUp";
      champsRole.classList.remove("visible");
    }
  }
  lienBascule.addEventListener("click", () => setMode(mode === "inscription" ? "connexion" : "inscription"));

  function val() { return document.getElementById; }

  btn.addEventListener("click", async () => {
    afficherMsg("");
    const email = document.getElementById("email").value;
    const mdp = document.getElementById("mdp").value;
    if (!email || !mdp) return afficherMsg("Renseigne ton e-mail et ton mot de passe.", "err");
    btn.disabled = true; btn.textContent = "Un instant…";

    try {
      if (mode === "inscription") {
        // vérifier les champs obligatoires du cahier des charges
        if (role === "hotesse") {
          const age = parseInt(document.getElementById("age").value);
          if (!document.getElementById("prenom").value) return afficherMsg("Le prénom est obligatoire.", "err");
          if (!age || age < 18) return afficherMsg("Tu dois avoir 18 ans ou plus.", "err");
          if (!document.getElementById("ville").value) return afficherMsg("La ville est obligatoire.", "err");
          if (!document.getElementById("insta").value) return afficherMsg("Le compte Instagram est obligatoire.", "err");
        } else {
          if (!document.getElementById("etab-nom").value) return afficherMsg("Le nom de l'établissement est obligatoire.", "err");
          if (!document.getElementById("etab-siret").value) return afficherMsg("Le SIRET est obligatoire.", "err");
        }
        btn.disabled = false; btn.textContent = "Créer mon compte";

        // les champs partent dans user_metadata → le trigger SQL crée les entrées automatiquement
        const meta = role === "hotesse"
          ? { role, prenom: document.getElementById("prenom").value, age: parseInt(document.getElementById("age").value), ville: document.getElementById("ville").value, telephone: document.getElementById("tel").value || null, instagram: document.getElementById("insta").value || null }
          : { role: "etablissement", nom: document.getElementById("etab-nom").value, type_etab: document.getElementById("etab-type").value, ville: document.getElementById("etab-ville").value || null, adresse: document.getElementById("etab-adresse").value || null, siret: document.getElementById("etab-siret").value };

        const { data, error } = await auth.signUp({ email, password: mdp, options: { data: meta } });
        if (error) throw error;
        afficherMsg("Compte créé ! Vérifie ta boîte mail pour confirmer ton e-mail, puis connecte-toi.", "ok");
      } else {
        const { error } = await auth.signInWithPassword({ email, password: mdp });
        if (error) throw error;
        afficherMsg("Connecté ! Redirection…", "ok");
        const { data: p } = await db.from("profiles").select("type").eq("id", (await auth.getUser()).data.user.id).single();
        setTimeout(() => location.href = (p && p.type === "etablissement") ? "etablissement.html" : "hotesse.html", 600);
      }
    } catch (e) {
      afficherMsg(e.message || "Une erreur est survenue.", "err");
      btn.disabled = false; setMode(mode);
    }
  });

  adapterChamps();
</script>
</body>
</html>
